body:
  text: 元始大洞玉經元始大洞玉經序純陽帝君曰吾道貴長生所重者命而已而道之命所以異于人者神而已人以形爲命形則有生必有死道以神爲命神則無死亦無生元始天王說是仙經正欲以長生萬劫之元神拔度種民于輪迴苦海之中以躋淸微大有之天也故其所謂神者不落虛無寂滅之鄕灰斷而塵空也實有其神之體實有其神之用以變化氣質瑩徹智慧救萬世之凋殘夀千劫之仙靈者在矣顧世之論神者不究其旨有以魂爲神者而不知神非魂也有以識爲神者而不知神非識也蓋神之眞體在于元精神之眞用在于貞明而已不觀之天道乎天道三寶日月星日往則月來月往則日來以至辰綱星紀燦爛朝昏者皆以精明爲體用也而神亦如之夫人之元精稟于太始傳于祖劫非身中精液之精乃性中精一之精也能洞觀其妙葆此眞精則其光晃耀大如紅輪明如皎月不落于色不滯于空者是其體也明因精發有是體卽有是明洞煥無垠昭融有象者是其用也具此體用而眞命乃全由是而孕玄分元化現三十九章之神弘帝一眞道以證大洞尊君孰非元命之功有以薰修而馴致之哉然則學者誦詠是經祈爲帝臣舍此神無以爲命舍此精明無以爲神舍此神無以爲帝一則所以求其精求其明者誠不可不夙夜乾惕鄭重而加之意也故特揭其旨而跋之元始大洞玉經序粵稽元始天王卽毘盧遮那聖主爲生佛生仙之祖而此經則爲度仙說也以大洞爲名者大洞乃太虛無上之道太虛之體圓明常住浩劫以來不染不搖卓絕天人之表不落聲色之中尙不可得而名又何容演說其道乎惟是人之生也分光于元始以宰此泡影之軀奈何認泡影爲眞昧此一靈之稟遂致厯徧四生沈淪六趣與大洞太虛之道日遠而日亡天王閔之故說此經冀拯其淪溺而復歸于大洞也仙經之道以帝一爲之體帝者大洞之神一者大洞之元也稱帝而性之統乃尊稱一而命之功乃至帝一兼修則可復還太虛而不至顚倒輪迴矣是以帝一爲修大洞之要然亦太上之所謂强名也原其始太虛空洞豈有帝一之名乎以有無玄三法爲之用三法復生九法是爲九統九統之法錯綜圓融互相出生爲眾妙之源亦性之功用自然也若泝大洞未發之前本無有如是之分別者甚矣大洞之道一法不立萬法全歸淸淨如如毋容議擬者矣元始天王慈悲廣運無量度人旣說帝一爲道之主隨說三十九章之神爲道之伴會帝于九統之法集神于九光之符而諸天神明燦列于玉戸金房分靈于三田八景種種不一然皆是有無玄之造化乃帝一之分具耳若帝一之道未成安望百靈之交會哉要而言之大洞爲大道之祖帝一爲大洞之長子三十九天則爲大洞之支庶肰必合支庶以屏翰蕃宣而後長子得高拱蕭臺之上御淸微而理萬機是集諸神以成帝一證帝一而歸大洞仙經之旨不甚深切著明矣乎誠以大洞卽元始之法身非大洞之外又有元始元始之外復有大洞也學者欲高出生死之關超越胞胎之界當疏瀹五臟澡雪精神誦詠是經尋源返本視經若雲章聽經若絲簧味經如甘腴佩經如芬芳使經之神理浹洽于肺腑骨髓之間自然諸神化現諸炁圓和拔擢尸魔削除陰翳而得大洞之神矣由是凝而集之精而純之心有帝而羣陰皆伏炁歸一而萬魔不淆而得大洞之眞矣竿頭再進直上崑崙高觀六合之庭寂盼泥丸之界以太虛爲堂奧太虛爲髮膚萬里空明千劫瑩朗于淨妙光中得證大洞之道矣學人至此方了仙經大願然則天王一音演唱九統垂光三千五百餘字之奧義玄言不皆爲大洞說歟若誦經者屑屑于神孳孳于氣而不循帝一之功以究極大洞之道失經旨矣昔者楚珠鬻鄭爲薰桂之櫝鄭人買櫝而還其珠秦女嫁晉從文衣之媵晉人貴媵而賤其女若舍其本而末是圖楚珠秦女不幾復見于茲乎是用探本而爲之敘康熙已丑𡻕五月望日南嶽紫虛元君魏華存謹敘
