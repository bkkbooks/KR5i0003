front:
  text: 元始大洞玉經重刋道藏輯要大洞玉經疏要十二義
  hash: sha256:79fb001f4e8ea0ebdc4f45ab3a3bc8b1aec417a739e4b1ac795d1dd47ba5a84d
  markers:
  - {type: page-break, offset: 6, content: '', id: CK-KZ_KR5i0003_02p001a}
body:
  text: 法體法界紫虛魏祖元君曰大洞仙經乃修證之大道也由入十信以生十善通十華而成十德非旁門小乘之修也登十仙而化十真非旁門小乘之證也而其所成之位則回光開度祖玄超證大洞帝一尊君弘慈回度人天進登太淸太極仙王真人超度萬靈又號太玄上德真人上淸真王太乙真人極品至玉淸聖王天中位統聖君則其位非旁門小乘之位矣所以天王現身説法為度仙無上之經然其要則在于帝一真道帝之為言王也天中有主人身中亦有主人身之主心也心有先天後天之分凡夫以情識用事顚倒輪回乃後天之妄主也真人則掃除情識親見本來妙淨圓明乃先天之真主也一者毋二毋雜之謂也凡人緣塵起相分別橫生錯亂紛歧二三其德真人則去妄歸真精明莫二夫是之謂真道具此帝一真道者自具帝一之法體帝一之法界者也凡人莫不具無量大法體無量大法界本與天王無盡功德海等無有二奈衆生迷真即妄將自已無障無礙之體界局在一漚一塵之中辟如金輪聖王夢為蟻子夢中居然以蟻自居不省本來是福慧具足之聖王也寧不可歎故修帝一之道者當知自已無障無礙之法體包含三十九章之天三十九章之氣三十九章之神以及三十九章之真文寶篆梵韻靈音無不在我三田八景之中光明羅列照耀無盡尤當悟自已無障無礙之法界即是森羅淨泓淸微天寶之都其三十九天八方圍繞各具日月星宿殿宇莊嚴塵塵剎剎互顯無盡法界與法體亦互顯無盡如此存觀以學者無量之精明上合天王甚深之妙湛逆流而上證以光音混洞性海無邊度越寥陽道境大哉至道無欠無餘而後不落于旁門小乘之體之界也若不知此體界而泛言經義是以拳石盡山勺水盡海無異井蛙之見寸管之窺誦諸經且不可况大洞仙經乎故首發明之誦經紫虛魏祖元君曰經有顯密二義顯者明示修證之義密者隱傳祕密之言仙經中所言帝一真道示九統之法傳九光之符以及三十九章經文奧句皆理之顯者也其三十九章中道君元君以及九真五帝七十餘位隱字祕諱如稱五帝為逢凌梵白帝為彰安華等皆言之密者也顯密並説天人互濟惟大洞經為然餘不爾也且諸經所説神咒皆天龍八部力士金剛山川神鬼之隱名召之以護持經教宣揚道法者若仙經所説天中之神即人身中三田八景九宫三谷五臟七政關節之神非在外之神可比在外者召之則難在內者招之則易果能虔誦此經久而不替未有不乘龍駕雲上朝玉淸者矣古人有言曰仙經乃天神慧火也誦經之功辟之金而煉于火也仙經乃天神性水也誦經之德辟之珠而養之水也煉久而金愈精精則與火俱化矣養久而珠愈明明則與水俱化矣化化相含帝一真道決可成已氣母紫虛魏祖元君曰仙經之言氣者二十餘章有以數言者則五氣八氣三華氣九素氣九靈氣之類有以色言者則紫氣元素氣黃素氣黃景氣之類有以真言者則靑靈華氣九皇真氣天皇真氣太乙元氣之類是也氣亦甚不同矣而不知萬氣本于一氣一氣本于太無能知太無之妙則知萬氣之根矣所云太無者乃太乙元真之氣布濩于太虛者也太虛之中湛然而停凝然而定燦然而明洞庭之月不足喻其淸漢陽之雪不足以比其潔三素之雲不足肖其華若遐而實近若微而實顯無臭無聲顧我復我者也而其中有氣母焉紅輪時露恍耀空明是即所謂精寶者也有此寶而氣無不歸若輪王所至七寶皆從不待言而喻矣然惟正定道人能見此氣能息此氣此氣非凡息之可得而呼吸者也必以玄息接之而乃真玄息者出有而入無出無而入有有無不羈定于太無謂之大洞真息真息定而萬氣齊歸矣此為仙經諸氣之旨祖玄紫虛魏祖元君曰大洞仙經特重身神身神有二一為陽神即經中隱名三十九章之神乃我先天陽氣之祖也一為陰神即九玄七祖億曾萬祖之靈乃我後天陰氣之祖也仙經之道務以先天之神化後天之靈消滅鬼根蘇荗仙根而我之元命方可升六位而證三淸經中殷殷致囑所謂去滯拔土斷血解結滅尸除穢束鬼散魔何啻三致意焉學人修此仙經務先斬斷愛根使厯劫情流不逸然後回光返度以已之淵湛真精混合天王之神工妙化薰修祖德普度遊魂一旦霧解星明煙銷火曙元神獨露陰結捐除厯劫宗親皆作九霄法侣而我之元命有不登霄階而上玉堂者乎今人皆知普度為功抑知度已之祖先為尤亟也學人速宜銷鑠陰魔以冀先靈解脫須知一氣相感百枝總一株千年如一日也愼毋有忽于經言太陽紫虛魏祖元君曰洞經稱太陽者屢矣皇上四老君則稱為九曜生太虛後聖君則稱為九光輪東華方諸君則稱為圓珠靄他如稱渺景赤景圓明太明者不一則其特重太陽可知然所謂太陽者非指天上之飛精乃丹元之至寶也元始以蒼胡頡寶炳耀萬天諸天則分其寶以照灼丹田洞明法界統無攝有堅定空明是真道之蒂神之祖也誦經之子若不能親覲輪王洞觀元妙如煮砂成飯道安可得哉無極紫虛魏祖元君曰大洞無極之象圓之規也太上之言曰聖人法天天法道道法自然無極者自然之體也小之莫破大之莫載不以有而實不以無而虛其為性之元道之元亦即天之元矣又曰大洞本虛真一則實又曰身居地中者凡夫也身居天中者真人也以身包性者凡夫也以性包身者真人也身在性中即身在天中矣此造無極之漸亦大洞之漸也泥丸關元紫虛魏祖元君曰人之一身玉門紫戶其所非一而其所重者在三田泥丸下田關元為氣之府經所謂太乙務命根天一元根仙者是也上田絳宫為精之府經所謂百司詣絳宫與心絳宫神者是也中田黃庭為精氣相合之府經所謂黃庭涉北元越度仙黃庭者是也泥丸為神之府經所謂勒精衛泥丸八景照泥丸者是也夫天中有梵氣玄氣元氣始氣道氣之五氣人身中亦有之學者能以玄息接之則五氣聚于關元至混然沖穆湛然凝定者氣之符也絳宫之精乃精一之精也不為私染不為欲蔽厯劫常住之體學者以覺照開之至精體顯露洞耀丹元者精之符也黃庭之府主混合精氣離中一畫為真陰坎中一畫為真陽此為陰陽互宅乃先天之精氣也惟中黃能混合之所謂黃中通理正位居體者則精氣之符也泥丸九宫乃九帝之居三素之室元始天王于此安鎮焉三一赤子混合靈光沖明道氣指揮結節之神解釋胞胎之滯則以是為宗矣此三宫泥丸之大略經中百神遊衍藏修之所不外此四者而四者之中關元泥丸二者為尤重蓋人身魂魄必使相制而後志氣淸明魂神魂也魄氣魄也神元在于泥丸氣元在于關元務使泥頂炎輪與關元水鏡相為含攝互為照應而後福慧兩全此大洞之祕也光音紫虛魏祖元君曰淸微太空之天乃元始法王之體也空中時發妙音演三玄大洞之道音之所至神光自生作瑤華碧華玉華三色其華細蕊如塵遍于空中上仙始得見之所謂性空之真色也有時神光先發而妙音從之音中有光光中有音光音無量不可思議其作樂也黃鐘先之鐘鳴一聲三時乃歇鐘聲之中衆音皆具惟玉磬則樂闋擊之餘則不待吹拊而自諧也黃鐘初動大和洋溢已見天雨妙雲樹搖花慢龍戲麟盤翔舞千端矣况鈞天齊奏之時哉和極而文自主金章玉縷廣長一丈曲折流光或攝氣舉仙或陶元溯始或流朱絢赤而會明陽或胎吉凝祥而歸空洞種種妙玄非言可盡猶之水性虛而淪漪結雲性靈而秀彩舒此大洞真文之所由始也誦仙經者宜悉之矣化機紫虛魏祖元君曰仙經所説皆化機也神機也君子所過者化所存者神况天王道氣所施道心所照自有默運而潛敷者豈尋常理數之學所可擬議而得者哉夫三十九章之神遊宴者有矣守衛者有矣徵召者有矣拔度者有矣左擕右抱回風混合者有矣上下無常出入靡迹皆神化之機不可以典要名之也天王于太和元氣之中化化神神蕭臺貴臣密布于金室玉房之內霄天仙子往來于朱宫紫戶之間一氣提擕一神貫攝珠璣燦落三田星斗輝煌八景其中顚倒五行陰陽搏換真希有之事能明其道者亦以神化之機接之自得身神歡悅萬氣齊和也人之所以不能神化者以相有礙智有礙耳能以洞陽之氣化其相圓明之慧神其智天王之機可直接矣三一紫虛魏祖元君曰神者妙性命而為言乃人之靈爽與微妙淸淑之氣在于丹田八景之中者也三十九章之神凡七十有六乃天之精靈與微妙淸淑之氣在于金房玉室之中者也人身至貴與天同體亦與天同神古仙回風混合之道存天中之神合身中之神所謂千和萬合自然成真者也顧其道繁矣屑屑而思章章而擬其隨設象而象我隨肖形而形我追乎爰有要焉約可以統博簡可以理衆諸神以三一為主當即三一而精思之寂盼泥丸高觀六合務令神光回照上接淸微則天王與我以神明而思可成矣思成而三一之神分化百靈遍于關節之間燦然明備燁然光華可不待言而喻此主伴之分重輕之凖也昔李仙君嘗謂桓凱曰身中祕寶頭曰崑崙中曰腦門乃神遊之地內有長生不死大君二儀四象八卦九宫諸天宫闕並悉圓滿人之兩眼猶天中日月其法以目注心想丹田良久便回光從尾閭㚒脊返照泥丸以朝上帝含光無間一紀飛升即此三一之道也原道紫虛魏祖元君曰修道有序不可紊也經所云混洞太無玉皇玄中者淸微之道體也赤混太無玉虛元生者玉晨之道體也冥寂玄通玉虛始神者太上之道體也中為性元為命性命既合而神始生此一定之序自然之大道也修大洞者務先得其中以為之本而後元神可漸證焉然不可泛而求淺而嘗也必從觀而參之觀者照也覺也以智覺智斷其有障斷其無障有無皆空而心華開悟豁然而大洞矣此中非中外之中中邊之中乃太無之中中而不住于中者也不住于中則無時非中無處非中故謂之玄中玄者圓不逐規方不逐矩不拘規矩而又不踰規矩者中之妙也即玄之妙也蓋心不落能所謂之中若一有所著即落窠臼而非中矣玉者白也皇者大也至白而無色至大而無垠其惟混洞太無之體乎證此體而元自生赤混紅輪炎天爍地照灼于祖宫者乃玉虛之至寶也有此寶而神自靈冥化通玄至寂而感于是神生妙有現象泥丸泥丸之內金闕玉房森羅泓淨中有至真兆以太無之元養之久則靈變無方分則為三十九章之神聚則為大洞帝一尊君矣然則泥丸寸地實即寥陽萬里圓滿光音不當於此取證歟道有三進而玄中為之首學者其研心焉神誦紫虛魏祖元君曰神以太無為宅蓋人之身六根成之陰陽範之遂為塊然七尺之軀若言乎神則超乎是矣故身有形而神無形無形而強求其形則為天元無極之象而已天元者實神之體也若求元神而必見其耳目別其手足則失之矣所以世人俗眼以為身外不是吾身真人慧眼始知身外方為吾身能知此則神量遍于虛空包含宇宙無窮道藏有不可思議者矣故誦經者以太無神誦為上也夫誦經之法有三一者明誦二者默誦三者半明半默誦三法總謂之形誦非誦法之妙也惟運我元神躋于太虛直至寥陽金闕之界朝禮元始天王定神太空之內自見天元無極法界圓明于中朗誦仙經混合百神真所謂太玄一音流響玉淸乃神誦之妙也是為誦經第一義大洞玉經壇儀嚴淨壇宇祓濯身心恭詣三寶前分班拱立舉讚道以齋為先勤行登金闕故設大法橋普度諸人物宿世恩德報道心超然發身飛升仙都七祖咸解脫淨身業神咒身中之內景三萬六千神動作履行藏前劫并後劫願身常淸淨常住三寶中當于劫壞時願身常不滅淨心業神咒大道降真