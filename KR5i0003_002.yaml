進之功誠度仙之要也學者當善會而進修焉紫虛魏祖元君曰大洞者性也亦命也胎之結者解之胞之滯者通之筋節關絡之間皆以神光貫注使得融通無礙是以身為空靈之府而六天之魔籍鬼根于此銷除淨盡豈不豁然而登大洞哉是仙經為性命捴持其力有三一曰威德力經中所稱祕諱密字皆天中道君元君之名名之所至靈即至焉靈之所至功即至焉三十九天統攝天綱主持萬有威德巍巍誦持之者可以祛除魔試轉禍為祥如世間有勢力人可假其威光降伏暴惡也一曰慈善力天尊起大悲心愍救衆生一音流響為之豁開幽滯超度祖玄上躋妙有如世間實修行人尚可呪願吉凶隨言成就何况天王之真慈誓願哉一曰理法力謂以一句一章含無量微妙義理悟解之者即可通達智慧得證無生革凡成聖况玉晨道君指修定觀方便殊勝為學仙上乘之門非理法兼至者哉是經具此三力持之得不測神功然究竟非是自力亦非他力緣自性海中具有如是現成功德故如象齒因雷生花是齒非耳云何有聞若無聞者花云何生又若雷能生花者諸物應有路絶道斷而花因雷出者以牙中原具靈花之性也誦經功效不可思議當亦如斯今學者每慮人身穢濁真神淸淨招淨入穢難於應感而不知人身至貴生神章有曰人受生於胞胎之中三元育養九氣結形故九月神布氣滿能聲聲尚神具九天稱慶太乙執符帝君品命主録勒籍司命定算五帝監生聖母衛房天神地祗三界備守九天司馬在庭東向讀九天生神寶章九過男則萬神唱恭女則萬神唱奉男則司命敬諾女則司命敬順於是而生夫人得還於人道濯形太陽驚天駭地貴亦難勝經言如此夫人誕生之始如斯鄭重者誠以其分靈於元始降氣於諸天人根原稟天根不為陋也所以衆生身中各具元始各具諸天一衆生念大洞則一元始現諸天亦現衆衆生念大洞則衆元始現諸天亦現若衆生身中無元始無諸天則元始諸天不現如陽燧身中不能得水非本有故元始諸天身中無衆生者元始諸天亦不現如石女求生兒必不可得以非應得故是以身中含身身中含身身此感彼應決無有爽也紫虛魏祖元君曰仙經為無上妙經然世之士夫未曉由來苟非宿有靈根焉得聞而深信今為宣明殊勝易生好樂之心此經有三派文昌帝君得元始天王金像奉事弗懈感受仙經以資正果此梓潼派也余顯迹茅山化為女姑授經茅君以傳世此茅山派也漢靈帝光和二年正月一日太上老君降於天台出大洞經授於葛翁此仙翁派也三派流傳互有同異然持誦之者未有不乘雲駕龍而登上淸者矣仙翁有曰修道者不知神丹之法終不得仙若得金汋神丹立便仙矣若得大洞真經者更不須金丹之訣也誦之萬過便可得仙此仙道之至經也圓通大士現身説法三十二應以度衆生為千古慈悲之主元始天王分身運化入人之三田八景六腑五臟之中為之解其胞結斷其地根馴致仙道以超無上是其救度之慈較大士為更切蓋大士之現身在身外此之現身在身內同一現身而天王之弘願悲心直貫洽於精髓命脈之微以拯兆庶以度種民嗚呼至矣學者宜知所用心矣學人之患在於俗事縈懷心不專篤雖曰奉道皈經一遇五欲時如膠如漆大洞之道遠矣若果能絶戀人間堅發信願誦玉篇於曲室叩瓊音以震靈則真人定録於東華玉女披潤於紫房制魔王以威神攝五帝以衛身萬遍道備中央道君上奏元始命太乙司命君駕八景龍輿來迎於子於是五老翼軒八風扇羽神帝前驅玉華扶轂上詣太素三元宫受書拜為高仙上卿榮何如之我願學者勤行持奉禮拜讚歎唪誦觀察四者為自度功德五回向祖玄救拔一切為度他功德自他兼盡則大道成而勳名萬劫矣時節因緣萬毋錯過重刋道藏輯要元始大洞玉經紫虛魏元君疏義卷上玄藴呪玄元始氣分淸華開洞神靈風回太和玉音攝流精至哉本自然誰識此玄文堅剛明一悟倐忽超三乘寂寂無色根永劫奚漂沈胡能精修持究竟登玉淸紫虛魏祖元君疏曰大洞太虛也乃我心內之太虛非空中之太虛也心內太虛周遍十方圓含萬法非有非空即空即有一片靈明浩然無際空中太虛在我性中不過浮雲一點耳世人不知此義漫言太虛不究太虛之體何如太虛之地何在杳杳冥冥昏昏脈脈止成一頑空而已非真虛也且若以太虛之虛為虛則虛自為虛與我性中之虛何與哉惟元始大洞之道靈通神化內則開其七覺外則啓其七窗洞觀洞微以至洞淸無所不洞無所不虛者也虛則會三十九天之氣合三十九天之神光為洞光音為洞音而成大洞仙經矣是大洞即元始之法體亦即是學者之法性也明此而後可以誦經序經道言此玉宸道君所序之經也昔在龍漢劫初龍漢者一氣孕于空洞之中太無之始上無復始下無復淵混沌太虛浩瀚流漠七千餘劫其氣周流相去九萬九千九百九十里為一歲其氣如龍變化莫測故號龍漢元始天王出大洞玉經於高上大有玉淸宫大有玉淸宫元始之都也大有宫名演太玄重玄玄一之道命之曰大洞仙經玄者玄妙之義也以形而論水火相合謂之玄以理而論有無相合謂之玄以道而論性命相合謂之玄太玄者性初歸命混沌立基也重玄者性命雙修建其有極也玄一者命復歸性結就圓珠中生帝一也三玄之義終始相生實天機之奧造化之源不可思議元始天王欲闡其旨故説大洞仙經元始天王始以太玄一音流響玉淸太玄妙氣藴而為光光熾成音天王始以一音流響玉淸遍為九音九音者一名檀熾一名帝心一名吉祥一名覺一切一名煥九靑一名遍塵剎一名入一乘一名令增長一名自然興也弘帝一真道説大洞寶文帝一者大洞帝尊之號也修三玄妙道結成蒼胡頡寶內生真神號為帝一帝者無上也一者無二也凡物之有對者非為至寶惟帝一真道大無外小無內莫有對者故稱為一證此帝一真身無漏無雜三十九真隨光化現千和萬合而大洞仙經於是乎成示九統之法傳九光之符凡法不出一心而於一心中復約以三法曰有曰無曰玄玄則兼於有無者也三法復生九法曰有有曰有無曰有玄曰無無曰無有曰無玄曰玄有曰玄無曰玄玄統而名之曰妙錯綜圓融互相出生曰衆妙元始天王示九統之法以會帝九光者玄符光真氣光最妙光一乘光三素光入深法光善開度光照迷途光滅惡光有此九光自成九符元始天王傳九光之符以集神使至士誦之登齋修行即得萬神歡慶萬靈護持萬聖感格萬仙翕臨誦之者心維其理齋修者身行其道故有如是靈感可以飛度三災四煞五鬼六害七傷八難九厄十惡飛度超越也三災水火風也四煞四方煞氣也五鬼五行鬼氣也六害六天害氣也七傷墜傷以及跌壓觸刑刃獸傷也八難王難魔難軍陳難飢饉難惡人難毒藥難行路難惡獸難也九厄疾病精邪枷棒刀兵水火蟲蛇劫眓疫癘橫死等厄也十惡貪嗔癡殺盜淫妄言綺語兩舌惡罵也登仙入聖神生紫微自然無為不係陰陽五行六氣之所拘束紫微乃上淸之天也虔誦此經則神生天上不為有為之法之所拘繫自至士誦之至此言齋修者之應感念念增長趣入大乘弘之無窮諸天下觀玉帝降鑒飛天保迎億曾萬祖厯劫種親遊爽滯魄俱得更生世胄接仙長為貴人人能進悟大乘恢弘其道則天帝下鑒神王保迎種親齊度世胄接仙以上言弘道者之應感功滿道備骨肉同升乘龍駕雲上朝玉淸此言窮修大洞上登玉淸乃大洞之極功修真之至軌也元始天王嘯咏太玄凝神遐想而説洞章凝神遐想有不輕發之意重道故也紫虛魏祖元君疏曰大洞三十九章以表三十九天也一天有一天之氣一天有一天之神其神皆從玄元始三氣中流出乃先天之祖元陽之靈元始法身中之至聖真神也在天為真王之貴在人為元皇之尊所以運導古今斡旋造化生道生仙生人生物者元始天王説此寶經應身千界分化萬方救度衆生解胞釋結上證天仙是經之所重莫過於神而神之所守神之所運神之所混合神之所拔度種種不同皆天中所修之道也有道自有因有因自有果果之所證由十信十善以漸躋於十仙十真無不各極其至而成大洞帝一尊君此皆三十九章之神輔翼左右贊化而為之者也故三十九章之經所以表三十九天實以表學者之三十九身耳以天合身以身合神而大道可幾矣詮釋此經以天之氣天之神天之道天之果四者為綱領至於每章之文則分其句義斷其旨趣徐察而深會之庶乎天王之玄言真意可得其萬一云高上元皇君道經第一高上洞元高者至極而無以加也上者至尊而無以進也洞者至虛而無以間也元者至長而無以先也此言道之體即經之體也元生九天元為造化之祖元始謂之高上混洞太無元靈寶謂之赤混太無元老君謂之冥寂玄通元此三元者即玄元始三氣三氣生九氣以成生神九天是三氣為天地之尊九氣為萬物之根也氣祖太無衆風胤玄玄元始氣生於太無乃氣之祖根也風者氣也衆者多也混洞太無元之氣九萬九千九百九十億萬氣赤混太無元之氣九萬九千九百九十九萬氣冥寂玄通元之氣九萬九千九百九十九萬氣蓋萬氣根於九氣九氣始於三氣是三氣九氣為衆氣之祖則衆氣豈非三氣九氣之胤乎胤者嗣也續也言嗣續玄氣於不已也又高上虛皇君有曰衆風允玄人鼻之氣也以上四句言氣之生生無量以明大道之原玄曾絶散四淸撫間玄曾九玄七祖乃陰氣之根也絶散者真一之元藴崇則陰根蕩絶四氣朗淸矣撫間者間即虛也心本虛間無如擾之若牛毛而間亡矣能修大洞則掃除一切歸其湛寂之常則間復為我有撫之者翺玩高明希夷皓素正猶金翅飛空前後無際不依於虛而又不墜於虛悠然自得矣又高上虛皇君有曰四淸撫間乃鼻下口上之間也當令鼻氣恆間又當數加手按帝一上景連衆攝煙氣中有神帝一為上景之神能統衆氣能攝諸煙煙乃氣之微者也氣從神猶之雲從龍也長契一運七世投間世有世運名世必待昌期道有道運真人亦因良會契運而修則度已度先逍遙無盡一運者太虛之妙運也投間之間即撫間之間人果能間寸心中乾坤萬里關元內日月雙丸靈明廣大何所不容何所不納哉七世曾玄皆作我間中間客矣兩間字宜玩以上六句言絶散玄曾投間七世帝一之福榮於祖先也託靈屬命返華自然凡人之性命必知其所止莊子曰吉祥止止止之為義大矣託靈屬命言性命所止之處也其道莫過於帝一人性有欲則雜雜則難一矣託屬於帝一之道則自能無妄無妄則無二真體堅完精華自返不待外求矣泯邈流輝六曜沈遷輝即十華之輝也泯言無迹邈言幽遠天帝光明熾盛踰於日月星然其光究非日月星之光明亦非日月星之明所以流輝泯邈之中玄遠幽深微妙而不可測也其輝湛寂圓明普周法界六曜之光視此不啻中夜一孤燈耳沈遷言其光沈而不揚也舉南斗以概其餘也又有云沈者滅也北斗落死南斗注生既超生死之表六曜亦無庸遷轉其籍也凌梵御暉西華彰安並編帝簡盡得解源玉帝諱逢凌梵御暉者言降其神光也白帝諱彰安字西華編者符籍也言帝簡其符籍而削其輪轉之源也以上八句言性命歸真返華流輝解源帝簡真福榮於自度也胎田邃路世發玉蘭靈光八輝混生萬神胎田仙胎所結之處邃路言其深奧也金丹無種惟以心栽帝一歸真玉蘭世茂靈光散其八輝萬神為之稱慶此總言證道之符也是為第一紫虛魏祖元君疏曰大洞仙經以神會道以道會真經中諸神乃元始之分靈九天之上聖也虔誦是經則神明生於密戶紫氣貫於黃庭默運潛施轉關易紐閉者開而滯者通枯者潤而稿者津精和氣和人和天和不止變其質而且生其智遂得透入重玄歸根帝一是此經者乃以元始之神為學者點靈撥機參玄悟聖之書也以天濟人以道消塵從無入有從有歸玄十信以立其因十善以修其業以及十華十德十仙十真妙行大全升於六位而為大洞帝一尊君皆仙經之妙用元始之神功也故此經誠為修真之寶筏首章明其大略而原其氣之所生神之所結以開大洞仙經之奧上皇玉虛君道經第二元始天王曰王虛順玄歸順者安也悅也九天之音謂泥丸曰玄歸天晨金霄遊朗朗生帝景歘爾駕玉洲上皇玉虛君有曰帝一有雌雄之道天晨為雌金霄為雄玉洲玄洲也左攝始童神始童太微小童也東方靑帝主肝部三魂右命起常扶帝卿一名起非一名常扶西方白帝主肺部七魄明真煥九霄九帝尊神名明真九霄謂九宫言光明煥照於九霄之上也三日映玄敷白元君名朱晶故曰三日玄敷帝座也以真火照映於帝之座也干景併生矜太微小童名干景精字會元子矜惜也愛而助之也內有幽寥無帝皇太乙名重冥空字幽寥無令我得長年千劫始一周黃籙保德創黃籙者帝之金簡也德創九天臺名也披錦入神𨚑神𨚑天谷也太乙務命根太乙尊神名務猶收務命根者堅而守之也公子召合符無英公子名玄充叔字合符子十回度初心得入大信根十回十過也紫虛魏祖元君疏曰信為入道之根此章首度其初心以入信而信有不同信小乘者小信也信大乘者大信也經分三段解玉虛君之在玄歸也雌雄生其帝景在玄洲也諸神輔其長年在神𨚑也太乙公子務守其命根焉隨所至而陶鑄之大信安得不入哉此道君安鎮三淸之道三淸即三田也三田空廢則萬神紛飛大道隳矣玄歸玉淸也玄洲上淸也神𨚑太淸也天神遊衍三田充實千劫長年顧道之所重尤在命根命根者道之元也不得命根道無由進太乙尊神以坎中一畫之真陽作乾健乘龍之聖體由是初心入信為學道第一義皇上玉帝君道經第三元始天王曰玉帝玄上旙皇上玉帝君有曰玉帝有玄上之旙一名返華之旙乃玉帝之旌節招真之號令也制命九天階以此旙制命九天之階級徵召四海五嶽之神王七覺乘妙道七星布氣於人在心則為七竅故曰七覺又曰悟為七覺迷為七情歡熙神風回歡熙悅和也神風者一身之氣也飈燦北停華飈燦日魂名停者留也紫英唱東隈紫英神名東隈猶言東隅乃發生之地也琳和九霄外玉符徵太微正一右仙名琳和太微即小童君三素生泥丸發耀金靈輝兩眉中間卻入三寸為泥丸乃萬神出入之所三素老君罕張上居此十華之中金華最貴金靈輝者乃金華之妙氣也煉氣成金耀明三素矣老君罕張上守衛死節機機者脈絡也機動氣行氣隨機止故須守之十善生玄中度厄而自然十善與十惡相反玄中道中也有無玄妙之中也紫虛魏祖元君疏曰此章所重在於七覺七覺者善之本也七覺既乘妙道神風始得回旋琳和太微以及老君三素諸神皆神風中混合變化之靈也而神風實因妙道而致覺者虛也道亦虛也以虛養虛微妙自生歡熙之所由兆也此章為玉帝命靈之道玉帝為七覺之王乘妙道而百靈肅肅萬氣雍雍帝心所敷十惡自絶而十善自生矣上皇紫晨君道經第四元始天王曰太冥絶九玄洞景寄神通上皇紫晨君有曰太冥在九天之上謂冥氣遠而絶乎九玄也洞景者洞陽之館為神明寄迹之所通者變化莫測也玉帝乘朱霄玉帝乘回風而御朱霄以統御萬天也緑霞煥金墉霞乃日之流輝映於雲氣此乃太冥之光所映故其色緑墉城也上館雲珠內仰接無匁峰雲珠者五雲之珠乃雲母也時吐妙雲流映上館無匁峰者玉京山之最高峰喻人泥丸之頂可上接玄虛太漠之鄉也靈關太漠下靈關者神氣之宅也太漠者太淸之外也靄沫竟沖空靄者火之餘沫者水之餘言水火微妙之氣液薰蒸而上沖也冥化混離坎冥化冥然而化言水火相融也玄玄叔火王瑋寂高同生上元玄父名叔火王字左回明上元玄母名高同生字右回光瑋寂者玄牝之門也無極保谷童無極無盡也保谷童元君精魂之名圓塗無礙滯圓塗乃真中之一竅無礙滯者三宫升降往來不息也綺合有九重紫晨君有曰玉津天中有綺合臺下有萬津之海其水波湧如連嶽焉又有云綺合九重乃混合九宫之義南拔七祖根西解纍劫凶南謂朱陵煉度之府西謂金母流雲之宫體矯萬津波神王攝十方體矯乾健之體也性海澄波真身特露其象如此神王者言帝君為萬神之主非指飛天神王也攝者統也收也言其威力也大歸返胎轅大歸還丹也胎者聖胎也轅者真氣不息之隃三合乘天龍三合者精氣神三上藥也合三藥而成丹可乘天龍而上升矣紫虛魏祖元君疏曰此章分三段解天中太冥之鄉玉帝君之所御也緑霞煥於金墉雲珠流於上館天宫妙境仰接高峰此神通之在洞景者然也其神氣之宅在靈關一竅坎離冥化以至綺合九重此神通之在靈關者然也由是拔祖根而返胎轅則功普陰陽矣此紫晨混化離坎之道洞景離宫也靈關坎府也冥化離坎而胎轅可返矣雖坎離並舉而靈關之道尤經所重靈關非有非無在太漠之下以有守之則側以無守之則𣣱惟以道而守則圓塗無礙而體矯津波矣所謂道守者守而不守不守而守靈光煥照內外雙泯為十華飛度之基太微天帝君道經第五元始天王曰太微天帝宫太微非星垣即玉皇經所云太微玉淸宫也八浮入雲營太微天帝君有曰九天真人呼風為浮八浮猶言八風即回風也營聚也雲營雲氣之所聚喻泥丸也神宗理靈禁中央司命丈人一名神宗心之主也靈禁胸禁也言五神之中又以心為主也龍山秀玉京龍乃木類木主東方龍山東山也乃玉京之山也金房鬱明霞金房在西言金氣化為明霞也九戶朗高瓊心有七竅以應七星玄牝以應輔弼故曰九戶言九戶之瓊光朗然而高明也黃庭涉北元黃庭中黃也涉者土德厚則能振河海而不泄矣元父左回明上元元父字回明朱晶啓明師幽寥登上淸右白元洞陽君名朱晶白素右元君名啓明師幽寥即帝皇太乙之字乃本命之神也四玄秉元禁長保五帝城四玄者靑龍白虎朱雀玄武也秉禁者四靈禁制之謂也五帝城謂五臟紫虛魏祖元君疏曰此章分二段解天人高居太微翺玩神營於山見龍山之高於房見明霞之鬱九戶高瓊朗然內映此太微靈禁之所寄乃內院之莊嚴也而其道尤在黃中通理鎮攝北元元父朱晶相為佐理於是四玄秉禁長保帝城乃外天之壯麗也此為太微回黃之道言回八風之氣而抱黃華也夫五氣施行於天而土德最貴真土之氣不落五行遍於虛空天真皇人謂之太乙真土所以持護丹元拱衛萬天者此其為大道之根十華之祖也三元紫淸君道經第六元始天王曰紫淸太無中紫淸天處太無之中三元上景衢紫淸君有曰三元之氣在上景之衢三元者指玄元始三氣也秀朗大寶輝紫淸君有曰秀朗乃玉淸天中臺名大寶者蓋指蒼胡寶珠言昭昭扇帝敷昭昭顯著也扇動也帝珠朗耀於帝座也伯史啓三素命門黃庭元王君始明精名伯史原其氣在下三素老君之氣在上啓者闢其路使相通也帝靈登玉虛帝即帝一登玉虛者達於泥丸也慶氣育五雲慶氣吉祥之氣也五指五臟言吉祥之氣生於五臟而成雲也司命理明初司命心宫神名曰理明初主典年夀長短之期十華妙行仙十華十方光華也學者真歸帝一道契重玄則其元神得通三境玉虛之氣招芳擷秀而十華圓滿從此進修妙行位證十仙制魔生六明六根生六塵人能消其塵斷其根則為六明而六洞之魔可制矣紫虛魏祖元君疏曰此章一氣説下紫淸以蒼胡頡寶昭明於秀朗之臺伯史為之啓三素之途帝一爰是登玉虛之位五雲流慶司命贊揚十華具而妙行成矣夫十華者三境玉虛之妙華也先天之氣無色而無色之色乃為真色真色所敷煥耀於太初流輝於無始是非色界之祥光乃真空之慧彩也此為紫淸三昧玄珠之道道君智慧如日洞照玉虛吞鑠無際精明所攝十華自通以上紫晨太微紫淸三章所證同在十華真陽元老君道經第七元始天王曰真陽帝賓老受事會玉皇元老玄一君有曰真陽上淸之館名按正一左仙仲成子一名帝賓受事於玉皇如真陽之上朝泥丸也滅魔除穢尸魔者六天洞魔之氣尸三尸也滅之除之而陰氣廓淸矣百司詣絳宫心為絳宫百關之神咸詣此聽命逸宅丹玄內元老玄一君有曰逸宅者真氣之明堂也丹玄指泥丸之所五氣結十方五臟真氣流遍十方如所云五雲浮蓋也七轉司命至七返丹成則司命自至三回召仙公三合成音以召仙公仙公即無英白元諸神也泰山主鬼者急校三官中泰山主者東嶽也校籙籍於天地水三元之宫以削其鬼根也十德初成基同飛七覺元十德者用德合體進德坦平成德廣大智德內淸慧德發光明德圓華靈德普應玄德大方大德自然普德濟攝也十德既備於是司命仙公諸神同朝絳宫而升崑頂矣崑頂者七覺之元也紫虛魏祖元君疏曰此章分三段解元老受事玉皇滅魔除穢廓淸陰翳百司之神無不詣絳宫而聽命此明神之有主也而其逸宅丹玄五氣結於十方明氣之有統也七轉三回而主鬼者亦至解陰魔而十德成基神氣之應也夫人之元精元明具於絳宫而其根則在泥丸精明之著謂之德精以湛智明以瑩覺十德乃全此為元老洞理覺元之道也上元太素三元君道經第八元始天王曰太素三華氣太素君有曰太素三元宫中有三華之氣生於自然蓋言精氣神之華也晨燈廣靈堂按三元君曰晨燈者玉真天中明氣之光洞照於三元之臺者也廣靈堂上淸之房名兆能存雌一於夙夜誦洞章及萬遍者則太微小童負五圖於帝側絳宫真人承五符於胎尊合變於三素之氣得形於晨燈之光而終身不亡矣玉京表玄籍玉京諸仙玄籍之所在守命孩道康大丹隱書有云命門桃君者攝稟氣之命乃始氣之君也還精歸神變白化靑合規挺矩生玄肇冥天地之資元陰陽之靈宗金門玉闕房戶之室並制命於桃君之氣其名曰孩道康一名命門一名胞根回風散萬魔風氣也即光也人兩目為身之日月以兆日月之光回抱神氣於丹田則可以散萬魔而立命金符召廣鄉廣鄉北陰之鄉也於神為腎金符召之使陰爽皆得超生腎屬水金能生水故也輔衛地戶內保此長生王按中央司命丈人為帝君五符之神故曰輔衛晨治幽極宫在兩眉間之上一寸夕治地戶在外腎之間轉入十仙門八景齊洞陽十仙門者無礙門定觀門衆妙門希夷門自在門長生門進仙門飛仙門登真門真一門也八景者人身有三部八景之神三部上田中田下田也三部各有八神合二十四神以主一身之門戶洞陽者日之上館立夏之日止於洞陽宫此言周身之神氣如日之止於洞陽也紫虛魏祖元君疏曰此章一理貫下人之神氣恆趨於外惟神風能回抱之神為氣母氣為神子母回而子從神氣混融陰魔蕩散可以成丹可以脫化矣孩道康命門之主也回抱真一聚三華之氣入晨燈之堂金符保長生八景齊洞陽恢恢乎登十仙之門有餘矣此為太素晨燈之道晨燈之輝不止昭宣於廣靈並能朗徹於地戶陰陽齊度其道神矣上淸紫精三素君道經第九元始天王曰紫精育華林按三素君云上淸紫精天中有樹名育華林其葉似竹而赤其花似鑑而明其子似李而無核食其葉而不飢食其花而不死食其實而飛仙所謂絳樹丹實色照五臟者也長眠太無外眠者冥息正定也太無外者虛寂之鄉也玉房生寶雲三素君有曰上淸玉房生七寶之雲雲色七重其氣九扇惟童子辟非童女宣彌得乘此寶雲上玉淸之天九扇胞胎內九扇猶言九氣也胞胎謂靈胎非結節之胞胎也帝賓奉玉符三光回紫蓋帝賓見前三光者於天為日月星於人則為兩目與天目也回者回光返視紫蓋者頂中華蓋也蒼玉斌來生衛此長夜會蒼玉産於黑水水之精也喻節中黑氣君也黑氣君名斌來生守衛九腸之口幽冥之所故云長夜會五靈度符籍九統合九光五靈五神也太乙主生司命主命無英主精白元主魂魄桃康主神靈人有五符五籍五神執之而稟於帝君故曰度九統分九方始靑太靑始丹太丹始素太素始玄太玄大梵諸霄也九光見前三玄出太淸紫陽發萬生三玄太玄重玄玄一也紫陽者陽至於極其色正紫謂丹元也發萬生萬氣齊生也玄精育九靈元父結胎仙玄精玄液也曲水天開玄精流潤而育九靈九靈者一曰天生二曰無英三曰玄珠四曰正中五曰子丹六曰回回七曰丹元八曰太淵九曰靈童又絳宫亦謂之九靈之宫元父即上玄元父高同生也胎仙者聖胎胚藴中生赤子也胎仙有氣而無息紫虛魏祖元君疏曰此章分二段解紫精道在太無而正定於其中玉房寶雲胞胎九扇太無之氣也奉玉符者帝賓衛長夜者蒼玉太無之神也於是五靈九統三玄九靈無不各極其道而贊化焉胎仙有不結乎胎仙之道非一以精氣為胎神識為仙者結之小者也以大洞為胎帝一為仙者結之大者也此太無之胎也超超乎其上矣是章為三素胎仙之道靑靈陽安元君道經第十元始天王曰靑靈扇八氣鼓輪三華城靑靈君有曰靑靈者真人之位號八氣雲色之相沓也三華城者精氣神所聚之所也鼓輪者靑靈之氣鼓動發生也拔此胞胎結七祖受福生人生胞胎中有十二結節盤固周身致生諸病老死之苦兆能解其結則求死不得也胞之上部四結一泥丸二口中三頰中四目中中部四結一五臟二太倉三大腸四小腸下部四結一膀胱二陰中三穀道四兩足宿對滅五道宿對𡨚對也五道謂人修羅地獄餓鬼畜生也宿對既消五道目滅矣常守帝一營雌一雄一帝一為三一惟守帝一者尊大洞也營者帝一所安之處也公子執五符大丹隱書曰左無英公子者結精固氣之主三元上氣之神故執五符以招集魂神也太乙居紫房大丹隱書曰太乙者胞胎之精變化之主常居紫房以掌仙籍紫房者太極九宫之一也三合地戶下拔命玉帝宫三氣合德故曰三合地戶指下田玉帝宫謂泥丸也少女郁墨子衛兆七氣窗斗中少女名太乙郁墨子字天凡人之耳目口鼻五臟之門戶也其竅凡七故曰七氣窗拘制盟血液盈滿五臟充九天真男名拘制字三陽盟者主也十真登紫房十真者精真玄珠氣真玄力神真玄通性真玄一元真玄妙命真玄光形真玄全德真玄洞道真玄應全真太玄也紫房見前帝子化金仙皇一之女名上歸字帝子金仙者赤子乃金液所化也又云十真道備煉化紫金白玉飛符招引升龍臺天玉京符召龍臺引升龍變梵度天也紫虛魏祖元君疏曰此章分三段解靑靈者八氣之王也鼓輪三華胞胎結解七祖福生而陰中之陰化矣公子太乙三合地戶拔命帝宫而陽中之陰亦化矣於是少女衛七氣之窗拘制盟五臟之液證十真而化金仙厥有由也夫道在帝一一即真也真有十門道無二致以一應十而十皆具一以十歸一而一皆含十真一雙融一真並著大道全矣此為元君紫房煉仙之道仙煉成真與三素同其功也皇淸洞真道君道經第十一元始天王曰皇淸與上淸洞真元老君能生又能死按皇淸洞真道君曰皇淸者上淸三仙皇之真人也洞真者上淸元老之君也皇淸洞真俱合生於太無之外合死於廣漠之上所謂生死者隱顯之義也三帝已含生靈寶經保命延生品云妙無上帝妙有上帝混元大帝三帝有萬變也虹映上淸景虹映內景山名虹者丹氣如虹也玉華煥玉琳玉華玉淸之玉華也玉琳即發生內寶玉芝琅英也三途拔靈閣三途者天途為上尸之道色欲是也地途為中尸之道愛欲是也水途為下尸之道貪欲是也靈閣謂泥丸胞胎化兆形胞胎指聖胎兆形元神也日母解結仞七祖罪超升洞真道君有曰日母者玉淸之老母主胞胎之尊神也名曰正薈條兆能知日母之名而與之映合則胞結自解七祖罪消紫虛魏祖元君疏曰此章分二段解皇淸洞真在無生無死之表顯能生能死之化有無自在三帝含生虹映玉華言其莊嚴之殊麗三塗既拔兆形自化結仞解而七祖升言其玄應之無方也此為道君虹映內景之道圓光萬丈洞映上淸胎化成神而結自解夫人身之結莫甚胞胎胞胎者五陰所織堅牢莫解非得元始太無之氣點之使熱者冷濕者燥則膠固終天矣萬遍仙經哀祈日母庶得三塗冰釋結仞峰摧也高上太素君道經第十二元始天王曰高上宴紫霄五老輔玉根太素拂渺景太素君有曰高上皇人常宴紫霄之上玉根玉淸天中山名也乃五老上真之所治太素真人拂日月光華於帝一之前太乙天中呼日為渺景景讀作影合符帝一前符寶符也白帝皓鬱奬太上鬱儀文云日中白帝名皓鬱奬回金太霞鄉太霞鄉天中之鄉也言回金陽之氣於太霞之鄉也天中之鄉甚多如上淸神女居五靈鄉上淸真女居九光鄉太極帝妃居三丹鄉之類度我死戶閉拔出三途梁三途見前十通由斯生妙行由此興十通者始通梵通氣通華通力通道通靈光通神通帝心玄通冥惠元通也妙行三千六百之功也洞明光景中帝一真玄玄丹光四徹故曰光景洞明帝一尊君名父寧在字合母精其形如始生之嬰身長四寸所謂大洞胎始形之真也其道微妙故曰玄玄紫虛魏祖元君疏曰此章前六句言太素之道後六句言太素之果太素宴於紫霄而五帝輔之拂渺景之華回太霞之氣採挹陽晶以作道糧者也度死戶而拔三塗光景洞明十通自證矣大洞乃元始之法身也修之者以智融相以相泯智玄力漸通前際不生後際不起現在不動而十通互用玄一之妙至此而極此為太素洞明帝一之道洞明者以陽晶之氣育養其靈也以上二章經功爰在十通大洞真言大洞丹泓劾惠臨惠臨亶蚩亶蚩元和元和妙真妙真吉盧吉盧軫蘭軫蘭皇希皇希燾盧燾盧育飛育飛薈蔚薈蔚玄蓋玄蓋粗胡粗胡神寶化身周遍法界三界十方光明無礙大慈仁者平護陶平護陶左攝蘇護謨右攝蘇蘇謨天蓬天蓬天猷天猷黑殺黑殺玄武玄武叭吒叭吒鵬麟鵬麟六目飛天六目飛天元威九目元威九目剎古剎古騤象黃林飛龍飛天無極玉龍盤古開化盤古開化三界十方無極神王大化身無量隨願樗蒙隨願樗蒙決岑決岑大澍法霖大澍法霖救度衆生保佑天心天輪天輪法部多法部多修修修修轉轉轉轉成成成成升升升升洞淵天尊大敕召攝巴元醜伯丹劉煙負天擔力石炯開全反三六目元素忉利王監醜朗馥王稚豁落神虞祈列日支褒度皇王虎騎兜垠大碧一口睪滅水夔勒壘唐嶷西天岡音音刮郭羅王龍願竺陀鬱繿天王太極灝穹幽淸九素天魔宸極大魁斠元神宗橫天擔力八威明王含太樞太微五神十天皇帝舉洞岡舉洞岡舉洞岡來救護天圖龍王亢石金單洞真天丁和神親纓乘天元氣金剛十力八方飛天玉女溫質嚳師大翕雷公月翕日奔邱國大一金童薈徯煈南釋曇君九泰元龍王細石將軍權連曼拏鼐壺正一功曹目烜鼐泰纍玉壺極淸天王無量光明天虛空太靈日月星君天大神王致穹吳犀貉山土皇地祗山海地神鬼賓原陵土壘涓始吻噓風樞太靈炎噓域盧甝虞鼊輪端傑太微紫微孝春燧陽蠡𧔞玄丐丘蘭毗𣣱丘蘭騤癸一切真仙來救護釋音亶丹蚩樞燾陶騤葵一口睪滅水成斠角嚳穀南尋泰纍太甝酣鼊辟𧔞元丐勾重刋道藏輯要太上玉淸無極總真文昌大洞仙經注疏卷中南嶽紫虛魏祖元君疏義古虞東霞錢嶸集注隴干見曉慕珍校梓序經道言爾時元始天王眉放靑毫釋氏主性道家主神所以釋迦説法眉放白毫元始説法眉放靑毫頂旋紫氣萬華寶蓋浮羅覆形紫氣陰陽一氣之合也結成萬華寶蓋覆蔭法身道體之莊嚴也玉光金霞紆絢晃耀如玉之光輝金之霞彩晃耀天人心目玉宸道君太玄道父稽首顒𥩟願聽洞章道君靈寶天尊也道父威德自在天尊玄天上帝也皇上四老道中君道經第十三元始天尊怡然嘯咏曰皇上超無景皇大也上高也超乎無色之界無色無光謂之無景又道中君云皇上四老真人在日中無影輪轉九曜生道中君有曰皇上四老呼日為九曜生常乘明玉之輪旋轉日中回風混帝心回風所以聚其神也帝心天谷也虛明之所也回風混於帝心即觀真之妙道也八景運常寧八景見前常久寧安也廣霞參神天道中君有曰廣霞者玉淸天中山名乃九曜之所出五帝之所司也神天者元神之所居也五帝散日精五帝日中五帝君也度人經赤景奔日之音云珠景外圓中藏蘂淵五帝絳闕瓊池碧蓮靑紫白黃丹氣綿綿下流爾身錫以長年即散日精之義也液逸玄中膜逸安也津液灌溉玄中之膜間也血凝五華平五華五臟之英華也平調和也體寶圓珠映流曜瑩兆形體中之寶即胎元也東華真人呼日為圓珠映者日光映發也瑩者潔白也號為夀逸阜亦曰澄潧渟日中黃帝名夀逸阜日中黑帝名澄潧渟俱滅三惡機啓籍登太明三惡貪嗔癡也太淸天中呼日為太明令我保仙真仙綬披緑靑玉帝錫以緑之綬解禍冥途中超福晨上靈福天福也北斗第一九晨君姓上靈言削死于北晨也度世登玉鄉纍祖返胎嬰返胎更生也洞觀無礙空始通生圓明洞者通也無礙者不為形所限也洞觀為十通之始故曰始通始通之生在于明離色而觀明其明乃徹驪珠湛方瞳內外洞照淸日月之景外圓內方人目中之瞳子分其氣者也能離色而照則真景露而瞳方內外洞燭也紫虛魏祖元君疏曰此章分五段解皇上四句言取九曜之明以混帝心也廣霞四句言取五帝之精以凝五華也體寶六句言既得其精明於是圓珠映體流曜瑩形直自號為夀逸阜澄潧渟矣與日同體併與日同名而太明之籍有不登乎以上言映日之道下乃明其用也解禍冥途超福上靈返胎度世始通生明自得洞觀無礙矣是章言修行首以觀入證通亦以觀始洞觀于外先洞觀于內觀無可觀始得觀無不觀琉璃地中一眼不設而千眼具焉為道眼始通此為道君圓珠洞鑑之道珠性珠也鑑于虛即鑑于實而靡所不燭矣玉晨太上大道君道經第十四元始天王曰玉晨九天司玉晨見前九天即生神九天也太上大道君玉晨之位號也常保景化內九回鏡中淸景化大化也明堂為明鏡宫是玉晨所居解帶玉映室乘素入四明玉晨道君有曰玉映者玉晨之宫名四明上淸玉帝之南門也言乘八素之車而入其門也携提日中王併羽月中晨真魂者人之聖日一名甲一名烏精出于陽氣之外合于丹母携提者顧復之也真魄者人之聖月一名庚一名兔髓出于陰氣之外合于丹母併羽者左右之也道君有云友日中之神王併月中之高靈太乙召天魔帝君較萬精天魔六陰天宫之魔也拔遏死積氣越度仙黃庭言越度生死而仙于黃庭也帝立三關上八風舞神兵三關者上關泥丸中關絳宫下關氣海也八風八方神氣也神兵喻身中三萬六千神也左抱福醴液右提慶元瓶醴液元瓶指兩腎言故有左右之分腎氣上通于耳下實則上聰洞微無障玄梵通生虛明洞微者言聽之微也火燃于香雪飄于水定靜能聞其聲此則更在聲之外者故云無障無障者不為聲之所隔也玄梵者音也梵通生于虛明不在耳根也貫顙聞十方豁落一切聲顙額也上窮圓頂下盡方輿一切音聲無不洞徹豁落者豁然無間也紫虛魏祖元君疏曰此章分三段解玉晨八句道體也太乙八句道用也洞微二句道之所證也玉晨常保景化九回鏡中鏡者淸光圓滿影來無迹影去無痕瑩虛耀白於無窮故以為喻而解帶乘素擕日羽月皆言道君之自在光明也由是拔遏死氣越度黃庭扇八風而舞神兵左醴液而右元瓶洞微無障豁落十方豁落者豁然無間也夫離聲而後為聽去耳而後為聰離之極而聽圓去之至而聰滿聰滿聽圓乃為梵通通則是帝一之耳非耳耳矣此為道君聖耳梵通之道聖者圓通之極致也太淸大道君道經第十五元始天王曰太淸浮絶空太淸大道君有曰太淸天中有山名浮絶乃三天神王所治三天寶神符三天淸微禹餘大赤也日中開五暉日中有五帝故云開五暉靑帝圓常無捧籍登太明太上鬱儀文云日中靑帝名圓常無字昭龍韜太明見前受籙金華樓大道君有曰太淸之天有金華樓諸受真仙玉籙者皆在樓中五臟植玉根魂魄亦凝和玉根見前凝聚也和合也言修魂而制魄也洞空淸淨玄氣通生淸明洞空者無內無外凝然虛寂在太空之表而得太空之地謂之真玄於此調煉其息息從空起亦從空滅淸淨自然淸明聿生定和妙明覺玄息自長生惟定能和惟和自定定則明覺空妙坐在立亡玄息長生矣鼻端觀白尚克悟性况帝一真道在息先者乎紫虛魏祖元君疏曰此章一氣貫下太淸處浮絶之山三天神符保之奠其位也靑帝捧籍受籙金華隆其秩也五臟植玉根魂魄亦凝和正其命也洞空淸淨玄息長生符其應也蓋修道之要莫先於息息在能定定則自和和定之中妙明自覺妙者空有不羈自在圓通之謂也此為道君玄息長生之道凡人以息生身真人以息生神生身之息以身生神之息以神神定息和則妙以生明矣太極大道元景君道經第十六元始天王曰太極元景王三天攝神生元景君有曰太極有元景之王攝三天之神仙者也紫素翳鬱仞安來上玉京紫素左元君名翳鬱仞字安來上玉京頂中九宫之一也拔出五苦界返胎七元庭五苦者色纍苦心受泰山地獄之報愛纍苦神受風刀拷掠之報貪纍苦形受摙山負石之報華競纍苦精受填作江河之報身纍苦魂受吞火食炭之報七元庭者七覺之庭也九玄解重結纍祖落𡨚名重結生生之胞結也徘徊秀華下俯仰邀五靈秀華者華蓋之臟也五靈者太乙居腦總衆神也司命處心納生氣也桃康位臍保精根也無英居左制三魂也白元居右拘七魄也各有所司也兆身升玉堂五神回孩嬰玉堂玉帝宫也五臟之氣化為五神即無英白元太乙司命桃康也回孩嬰者先天赤子之象也俱躋太漠外養素朝圓明元景君有曰太漠者太淸之外也太極真人呼日為圓明又太陽九氣玉賢元君曰太漠者胎神之所在也故太漠為重玄之根若胎開而明潔則帝一之氣全矣洞虛淸淨和華通引玄明洞虛與洞空不同洞空者息之空也出入無著通塞無礙謂之洞空虛者味之虛也化甘苦而歸淡化淡而歸虛味不在舌亦不在物亦不在舌與物之中間淸淨不染舌根自和華液通而引玄明矣玄者色也北方之水也為天一之水故明舐鍊五芽珠含善味長生五芽即五臟之華華結為珠珠中神水自灌靈根非善味乎安得而不長生乎紫虛魏祖元君疏曰此章太極八句言大道元景之王同紫素左元君拔苦落𡨚之功也徘徊六句言兆身之邀五靈回孩嬰躋太漠而朝圓明之事也洞虛淸淨善味長生舌華由是而通夫人以味生亦以味死味造百千之業以致輪回帝一大道君一洗而無之身虛性虛而神亦虛味能養實不能養虛味於何有乎太虛之中養出真水以灌靈根則五芽自生矣此為太極養素通華之道舌根於心心以恬素養其舌舌以玄明潤其心左金津右玉液味之至善者也皇初紫靈元君道經第十七元始天王曰皇初紫氣中暉光鬱霄明紫靈元君有曰皇初紫元之天常有暉暉之光鬱鬱如薄霞焉三天煥九景離合億萬生三天三氣也三氣生九氣光景煥耀長春不夜離合者離則為九合則為一離合之中兆身億萬之氣於是乎生披朱巾緑霞上回寒童靈元君身披朱衣首巾緑霞上於寒童之山拔出五苦毒超形過始靑五苦見前東方曰始靑天超越始靑之天則三災不及安穩淨明矣白素啓蕭仞金門衛朱兵白素右元君一名啓明蕭仞字金門上衛朱兵者神鋒透露慧以全命也天中之用多以火雷以火發兵亦以火名火能消穢猶之洪爐不著蚊蚋也七祖積尸結一化百惡傾尸結者尸氣結節也化者化陰歸陽也受福東霞室返胎朱火庭東霞室靑華長樂宫也朱火庭朱陵火府也洞靈淸淨行力通自沖明洞靈命之至也精氣渾融胞胎結解易骨易髓而頑者自靈由是得淸淨力通沖和明達矣淨真手握斗足躡九元星既淨且真浩然獨存故能持其綱紐握斗躡星如中黃太乙君左手把七星之柄右手把北晨之綱北極大帝乘斗車履三台具自在神通之義揮執天地關不惟星斗可躡可握且天地之關亦得而揮執之皆言陰陽在手造化由我之意精神生命根造化由我力通無礙以精神生於命根故也命根者玄牝之門也紫虛魏祖元君疏曰此章分二段解紫靈元君以三天而煥九景億萬神氣離合自生於是拔五苦超始靑白素右元君亦為之衛朱兵焉東霞之福自此而受朱火之胎自此而返矣洞靈力通把握揮荷飛步蹻躡往來指揮而無礙者形之化也然皆運用於沖明真淨之中浮雲無心龍吟則起以自在力行自在行為調燮之大用實性海之一漚耳此為元君命根洞靈之道人身五陰盡則命靈命靈則自生神力以五行之身運五行之化有如是之不可量者無英中真上老君道經第十八元始天王曰無英真上玄玄中元素氣真上老君有曰老君處上真之宫領五帝之籍解兆五符於重結化兆五神於胎骨常遊紫房明堂之內玄即道也包含萬氣蓋有三元三素為之始也三元見前素謂紫素黃素白素也寄頻擕運珠渾化啓明日太乙尊神一名寄頻絳宫中一元皇丹元君名神運珠白素右元君即啓明蕭仞言三神共混化於太陽之中也正一左右仙長扶靈虛室正一左仙名帝賓正一右仙名琳和長扶者扶佑之也靈虛室者絳宫也兆有五符籍合仙得真一五籍者長五寸廣一寸白簡黑書載人之姓名五神執之稟命於帝君以削死者也五符者長一寸廣五分白簡靑書以上生者也合仙運數合仙也真一者不有不無真常之道也魂生太無中魄伏五道密此魂乃修士之天魂也非世人之三魂所謂胎光爽靈幽精者也天魂生於太無之中天魂既生地魄即伏五臟之氣始得密而不疏地魄者七魄交并之名也世世解𡨚結七祖絶滯塞神風吹胞樹根葉已斷絶度人經云神風靜默蓋神風出於橐籥以鼓扇生化者胞樹胞胎尸血之根也胎中衆鬼殃五符閉地結胞胎之結純乎陰氣故曰衆鬼五符之氣吞之長生所以能閉地戶結即十二結也長為神真仙應化續萬億既為真體依體起用自能應化而續萬億之功也洞真淸淨身道通自然質洞真者我之命元與造化之天元相為流通則法身可證而通自然之質矣自然者見於面盎於背不言而喻之妙也真應化現相不動住黃室具無邊法體即具無邊法相靜而能應不以迹求故雖示現多方而真一之主常住黃室而不動如寶珠無心而發光天鼓無心而發聲也應化無方在骨肉金玉實靜真明至道至老常不易上文真應二句言神也此應化二句言形也形神俱妙與道合真至老不凋矣老者千劫之長年也紫虛魏祖元君疏曰此章分三段解無英者神之祖也混化之者有寄頻焉有運珠啓明焉扶佑之者有正一左右二仙焉於是乘合仙之運而證真一之身矣魂生太無純陽之質也以太無之質施本無之化解𡨚結絶滯塞斷胞樹而閉地結焉於時陰魔既盡萬億功生洞真淸淨道通自然從體起用而不礙於體從用歸體而不礙於用如室懸十鏡九鏡之影涵一鏡中一鏡之影九鏡皆涵極而至於十鏡之影鏡鏡互涵鏡非留影影非住鏡鏡鏡皆顯影影無迹乃無方在之應化也此為老君應化黃室之道中央黃老君道經第十九元始天王曰中央黃素氣圓華玉夀靈中央黃老君有曰中央黃老君三元之真皇也圓華者黃老之宫名玉夀者太微天中之山名皆黃老君之理所也太張上玉門伏雲三仞明太張上黃素老君之字也玉門者泥丸玉帝宫也伏雲者伏五雲於三關之間也三仞者紫素左元君翳鬱仞黃素中元君圓華黃仞白素右元君啓明蕭仞即三界之上大羅天也赤景翳逸寥提擕太乙真赤景日景也景讀作影逸寥乃月中赤帝夫人之名翳者陰陽互映之義阿母言曰日圓形而方影月方精而圓象影藏形內精隱象中景赤象黃是為日月之魂若知其道乃可以吐納流霞耳太乙主變化又為胞胎之神所以提擕之也帝女抱定陵吟咏玉清經斗中中女名曰太乙氣精字曰抱定陵玉符編紫房五籍標圓庭紫房在明堂之內圓庭一名天庭在明堂上一寸七祖返胎仙絶滅三塗尸流風斷血滯玄業位黃寧三塗見前流風即回風也玄業玄功也黃寧者精血三真君之字乃中央土德之全也洞玄淸淨光元命靈通成玄者智相交融之謂也智圓相圓謂之洞玄元命從此靈通矣性命宗本堅孝道成明王宗性本也本命本也三藥成丹命基立矣天光履踐慧鋒透矣堅固真身為法王子可以上報宗親并可上酬覆載為父母之孝子亦為天地之玄孫孝道至是而成明王矣按孝悌王曰始氣為大道於日中為孝道仙王元氣為至道於月中為孝道明王玄氣為孝道於斗中為孝悌王生根得太和無為登上淸有為者功之始基無為者功之究竟登上淸者大道之所歸也紫虛魏祖元君疏曰此章分三段解老君高拱玉夀之山伏雲之界合日月之璧咏玉淸之經以至符編紫房籍標圓庭巍乎其為黃老之尊矣七祖胎仙三塗絶滅洞玄淸淨而元命靈通道之至也元命者性命相合之謂也性有宗命有本若本未透不得堅定必得性歸太無命歸太玄而後為元始之功臣即元始之肖子矣是為黃老元命洞玄之道性命雙修福慧兼全者也靑精上真內景君道經第二十元始天王曰靑精上華氣太微玄景童靑精上真內景君有曰靑精之宫有上華之室室中有自然靑氣號曰返香之煙逆風聞三千里大微小童流布華景之氣以潤玄關神化玉室內飛羽逸紫空內景君有曰紫空內景之山名靑精君常乘羽逸之車擕玄景之童登紫空之山入玉室之內也日為三矜交奉符登帝墉三矜交小童之別名言日與太微合氣也帝墉帝城也又云腦後為玉城開關把金節閉戶扣瓊鐘金節開關之符契也閉塞也戶死戶也扣瓊鐘叩齒也滅魔三酆野招靈上淸宫三酆者伏魔經云酆都山在天池間東北隅艮地高萬里分三層上層上元六洞宫仙官所主中層中元六洞大魔王所主下層下元三十七獄四方三十六中央一獄以總其事故曰三酆上淸宫者泥丸也明出窮陰關入精六合房明出玄明之氣從陰關而出也陰關氣海也精元精也六合房太乙所居在明堂之北洞房之南亦在兩眉間之上一寸回老變皓形返白還嬰童言返老還童也洞源淸淨光津液具神通天一真水道之源也能濬其源則長流不竭津液通神矣咽液生萬神神水華池融湧升灌而潤往來無有窮通生道之源天根常茂豐身中之水有二一者坎府之水宿海也一者華池之水天河也河海相通往來無盡咽液生神而天根茂且豐矣紫虛魏祖元君疏曰此章分三段解內景御靑精之天太微小童實左右之神化玉室飛羽紫空以至滅魔酆野招靈上淸皆其功也而又明出窮陰之關入精六合之房回老返白愈彰其績矣洞源淸淨而津液通神天根有不茂豐者乎人之一身水固不勝火也而人又焚其膏去道遠矣故必洞其源以生萬神前章古華之水資其淡此章華池之水資其潤曲水襄河一泓明瑩是為津液通源之道腎為精海腦為髓海而夾脊三關遡河流以通往來其用弘矣太陽九氣玉賢元君道經第二十一元始天王曰太陽化三晨紫軒微玄路玉賢元君有曰太陽九氣者變化三晨之上又策駕紫軿于微玄之中微玄者日中之神名也玉賢天中呼日為微玄元君保谷童守胃塞死戶元君精魂名保谷童守胃者胃為太倉萬神之所聚故守之而塞死戶金符煥北華玉契拔七祖金符玉契皆洞陽冶鍊之文北華光華煥映於北方也帝真灌上生斷息三塗苦帝真精魂名幽臺王字灌上生三塗見前洞明淸淨光帝心太玄通性根本明以識而障消盡識陰則慧日透露謂之帝心帝心闢而太玄自通矣宿命過去智根本元由中宿命者厯劫之身也過去者厯劫之事也智光所燭無不了然而究其根原仍不出我性分之中一透則無不透矣寶鏡圓徹無物不鑑也未來及他心一切無礙融未來者未至之事他心者他人所有之心無不備悉知見而無障礙矣洞源與洞明萬道由通生道之所重在水火之元故又並舉之源洞而水火自開明洞而神光自闢水火玄通萬道從此生矣紫虛魏祖元君疏曰此章分二段解元君為九氣之靈變化三晨之上策駕微玄之中塞死戶而斷三途道已至矣而妙淨明心於茲透露光含三世覺遍十方通達了明一無障礙誠以智量本圓不能洞之則自他俱礙若窮其性相斷絶陰魔體遍於十方用彌於沙界如慧日當空靡物不照過去未來特其性中之影耳此為元君洞明帝心之道帝心即道心亦即天心也天心無所不燭故其智量無所不通太初九素金華景元君道經第二十二元始天王曰太初九素氣氣出華景中金華景元君有曰太初天中有自然九素之氣氣煙亂生雕雲九色入其煙者易貌居其煙者百變華景者太初天中之宫名也法坦舞仙旗逡巡五老翁北斗第一宫內妃名太乙法坦字幸正扶舞仙旗所以攝萬靈也逡巡者優遊之義五老靑靈始老丹靈真老皓靈黃老五靈玄老玄靈元老乃太極中五行祖氣也夫人名啓珠執籍歸紫房北斗第八帝席宫高皇左夫人名曰空常右啓珠字曰絡茂華紫房見前元父左回明混合太微童名字俱見前洞淸冥智慧大意朗元通智慧者心之靈也心在虛中虛在心中智慧乃發智言覺慧言明也冥之者韜鋒斂頴遠離沈掉平等持心而入三昧也心之所發謂之意智慧既全則舉意朗徹而無礙矣根塵悉消滅有無皆虛空六根六塵一切幻妄及有無二見皆消滅也妙行全十真名大心神通道備登玉淸位為聖仙公此章本言意根洞淸而又曰大心神通者意由心生故追原之也從此而道備登晨德則為聖位則為公矣紫虛魏祖元君疏曰此章分二段解元君御九素之氣居華景之中舞仙旗執五籍元父小童皆得而混合焉命至心開根塵消滅有無虛空大意元通而心珠洞徹證聖稱公仙之上品道之極軌矣夫小乘具滅盡智不能圓通其意大乘具實相智則即體而用大意元通朗然無礙矣此為元君冥慧元通之道夫性能立命所以十通之證皆在淸淨光中無礙無障而修之則仙經之所重不亦深切著明乎大洞真言洞淵三昧天尊元皇阿暉層光晃曜大法輪大法輪真人神仙傳度救護收攝魔鬼無量王不惱衆生成就呪願洞淵呪敕普攝豸修猰豸修猰旃摶旃摶括豬山犬山魑烏貙貙句尅蝕蟲蠡𧳶豸修孕軫郁𡝐郁𡝐景胡駱綦洪盧洪盧貚貙貚貙魃鴆魃鴆靑真龗觥馥殷勾血高鄰賓鄰究賓目粦水虒水虒初波毒龍泉曲萬鬼並以呪力摧伏惡道玄天龍劍黑角駝毬斷斬惡根地根救護善道仙趣度魔度魔正性和神攝毒回慈欽承黃鉞永離鬼趣來進仙階救護衆生解𡨚滅罪伏龍呼龍亶夷亶夷妙門妙輪開諦法門六明十通正真妙行率夷率夷大統攝率夷大濟度率夷大圓滿率夷八十一王尸羅剎神普助願力普持鎧仗神通錮護大破𡨚敵神王六明二十四開諦法門大淸淨妙法輪大覺警妙法輪大忍捨妙法輪大圓滿妙法輪大廣明開諦十大神通至真妙行丹黃紫文五文內珠九天八會隱環集素結友證聖德道成真元命真人法身自然普度衆生同等一乘出纒出纒離縛離縛解結解結見性解脫超真超神超聖太真無為無為無形無形希夷希夷與道合真釋音虒尸豸修修猰軋犬山撓魑蚩幼貙癡𧳶搜𡝐茶貚檀龗靈元始大洞玉經卷下序經道言爾時元始天王以大洞高上混洞太無元天寶玉皇之氣此初開混沌混洞太無之元即太元之氣也結一寶珠命之曰蒼胡頡寶此積氣而成精也是為精寶即性寶也蒼者靑陽之正色胡大也元氣光明正大也頡者元氣直上剛健中正也曰吾以此寶珠從道妙一善貸生根孕玄分元誕始傳真貸者借也借為萬物之根包含太玄分化三元發生始氣敷演真傳也化生諸天凝成萬氣諸天者上自玉淸下逮八梵則有三天九天三十二天三十八天八十一天百八十天萬二千天三萬六千天不能窮盡萬氣者如所云九萬九千九百九十億萬氣也大哉至寶惟我獨存今為玉宸道君重出斯寶獨存者獨有之也道本無匹天上天下惟道獨尊也元始於龍漢元年化生以此寶分化三氣今為玉宸重出之當在開皇以後矣諸天帝王天真大聖瞻望寶光其光分敷百千萬億結成大洞仙經玉文凝而成雲絢而成章玉文者貴重之詞凝而成雲言其象也絢而成章言其文也諸天帝王天真大聖以淸明識以始通觀以華舌通齊聲宣咏大洞雲章音徹萬天流響九地識者辨識觀者諦視通者會通也九地九壘也又九重也一曰元德二曰皇德三曰帝德四曰王德五曰人德六曰地德七曰里德八曰福德九曰昌德每壘一重土一重水一重風也天界地界水界神鄉一切神靈不離本座俱覩雲章絢目仙梵厯耳自玉淸下至罡灝為天界自土下至風澤為地界自海水下至泉曲為水界神鄉者天之下地之上東嶽所轄之界也皆悉百生障滅萬劫塵消三塗九幽十方惡趣三塗九幽言鬼道也十方惡趣言人道也咸承光音所及十纒九結六染七塵於是頃間一時解脫十纒十惡也九結者負命負財負呵罵負心負人負國負鞭撻負力負恩也六染六塵也七塵喜怒哀懼愛惡欲也於是太玄道父前詣蕭臺再拜稽首求授寶珠所結大洞仙經玉文雲章庶以導化人天衆生俱免萬災咸消衆罪不沉苦趣俱等一乘弘是願言殷勤啓請鬱羅蕭臺元始之寶也元始天王命元神大聖玉宸道君具俯仰威儀手付太玄道父蒼胡頡寶此言三聖授受之事元始天王告曰此蒼胡頡寶與檀熾鈞音若非太玄何能求請惟子慈深願重可𢌿寶章蒼胡頡寶光也檀熾鈞音音也運光音以闡道也紫虛魏祖元君疏曰道有三奇第一奇大洞真經三十九章第二奇五老雌一寶經第三奇素靈大有妙經故三十九章者為九天之奇訣上元太素君金書之首經也上卷係玉宸道君所集經出龍漢初劫天王以太玄一音流響玉淸應運而説也下卷則元始自出寶珠其光凝為洞章以太玄道父之勤請命玉宸道君傳付之者也是經三卷非一時所説乃道君道父集其樞要分其章句三十九章為三卷以便修習其功在度人生神黃庭之上九皇上真司命君道經第二十三元始天王曰九皇上真氣四司天仙王九皇上真司命君有曰九皇上真玉虛之元君也四司天之禁宫也飛霞散天日凝煥六合房司命君有曰飛霞玉虛天中之山名凝聚煥明也六合房見前上真朝玉淸乘景晨中暉司命君有曰晨暉玉虛司命之宫名也五辰號發紐捧籍啓虛皇五辰即五氣司命精魂名發紐子虛皇上帝也逸録登紫淸金符刻羽宫逸録仙王之符録也紫淸天即玉淸聖境金符為萬神之契合羽宫者仙羽之宫飛仙之所栖止也領玄蒼胡珠弘濟登普光領受也玄妙也蒼胡珠人之黍米即丹母也弘濟者濟度羣生升於普光之殿也運度玄中人咽味生五芽結集成胎仙丹母全真陽玄中人應度之人也咽者咽液味者華池之味也天地以水運轉循環無窮故不朽壞人以津液流灌五臟故可長生五芽者五臟初生之妙氣也蘭芽初茁何如其秀潔乎五芽之生似之矣結集凝合也言五芽合一而成胎仙也丹母指丹元五氣朝於丹元而真陽始全也主伴合元範太易生玄光主者帝一也即元始也伴者三十九章之衆神也範法也諸神各有部分內外雍雍上下肅肅俱合玄元之祖範也又有云先天太玄之氣為主後天五行之氣為伴太易為氣之始五氣九氣始於一氣一氣藏於海屬腎宫故生玄光紫虛魏祖元君疏曰此章分二段解司命攝上真之氣稱天仙之王飛霞散日乘景晨中録籍金符雲章煥耀文明之化以自度智用也丹結蒼胡誓宏普濟以五芽之道運度玄中慈濟之功以度人悲用也五芽乃五臟之妙氣也金木併水火交五行攢簇於中黃而成丹母然其工必從坎府始乃太易玄光之所寄也此章為太易一玄妙行之道紫華天一精通太無也夫行有二在外稱功在內稱行妙行云者學者修行之程度也天皇上真玉華三元君道經第二十四元始天王曰天皇上真氣三元乘神徊玉華三元君曰天皇上真為上淸真人之典禁主玉華仙女之母故號玉華三元君也元君常乘神徊之車登雲揚之宫入流逸之臺神徊乃真人一輪車名法垣興朱霄帝昌啓玉扉太乙法垣起於朱霄朱霄即綘宫也泥丸九真名帝昌上皇字先靈元宗拔尸命門內解結桃康階下尸好淫欲故拔之命門之內桃君恆守臍中主下部胞胎之結故解之斂神保五籍越轉入太微太微宫見前單入而雙修一曲水天開單入先修命也雙修性命兩得也性水澄淸光含三界故曰水天開海日自東生元命升太初純陽之氣如海日自東而生上言性水朝元此言日紅山頂水火調而元命升太初矣太初者神之始也紫虛魏祖元君疏曰此章分二段解元君主玉華之仙乘神徊之車而高翔漠外法垣為之興朱霄帝昌為之啓玉扉拔尸解結太微可越矣而其道在於單入雙修即道君定觀門也定依於息觀依於真定觀修而性命全矣於是性水開東井之天紅日起扶桑之頂水火既濟元命自升為太初二元妙行之道丹華地二氣通凝玄也太乙上元禁君道經第二十五元始天王曰太乙上元氣日中司命童太乙上元禁君有曰太乙上元君者萬仙之司主方嶽真氣者也主除死籍刻書生簡太陽宫中有日中司命君名曰接生字通靈煥然神光明披霞升帝墉披霞者日光下流也言心神披霞而升於泥丸玉帝之宫也列坐震靈席混合五日房震靈乃制魔之符持大洞經者以之為席而坐也混合即回風五日者日中之五帝房者紫房也白氣育上生靑君案延昌胎中一元白氣君名務玄子字育上生結中靑氣君名案延昌字合和嬰左攜精上門右抱合和嬰節中黑氣君字精上門靑氣君攜之以生左目白氣君右抱合和嬰太和之氣以生右目也我生日月華友寶赤氣王太乙元禁君有曰赤氣王者日中之上神名曰將車梁能知赤氣王名者不死友寶者言愛而寶之也八景照泥丸朗然洞房中言八景之神得太陽之氣以發光也從眉間入二寸為洞房朗然者光燭泥丸也嬰兒為赤子混合生玉容陰陽混合水火既濟則容光如玉五道秀金華位為上淸公五道者五藴之根言其沖和秀發具金水之精華也上淸者高真之所居也七祖斷玄滯身神乘仙風徘徊三淸上和樂返胎嬰太始三氣周真文肇生明太始形之始也玄元始三氣既周則蒼胡現象而真文誕敷矣真文者經之文亦即神之符也文從明出明從性生真文者乃性之微妙華也紫虛魏祖元君疏曰此章分二段解禁君主上元之氣接司命之童披日霞合日房白氣君與靑氣君左攜右抱共友赤氣之王由是神成赤子秀發金華則其道爰在採擷飛精上奔赤景矣祖斷玄滯身乘仙風以至太始氣周真文肇明乃混合之妙趣浴日之殊功也夫鬼道貴陰仙道貴陽洞陽氣赤故上仙友而寶之然其所尚者非止九曜之芒也性地紅輪炎天煥地方為大洞之寶耳此章為太始三氣妙行之道靑華天三神通萬生也元虛黃房真晨君道經第二十六元始天王曰元虛黃房中內有黃寧童真晨君有曰元虛黃房者真晨仙君之所治也精血三真名曰元生君字曰黃寧子玄左有堅玉君右有帝昌王骨節二真名堅玉君字凝羽珠泥丸九真名帝昌上王字先靈元宗浮黃翳神氣鬱鬱虛靈容黃者土德真氣藴崇薰蒸元神之氣歸於天谷而生虛靈之妙容道相冠於諸天也靑肝明輪子開朗徹八窗靑肝四真名靑明君字明輪童子八窗者耳目口鼻及天目也太乙儔𨚑蘭奉符入玉宫斗中大女名太乙鬱書字儔𨚑蘭拔赦七世罪回元期十通回元還丹也回元而後可期十通十通見經呪中混合帝一室五老變孩蒙帝一室神室也五老即五氣太素梵行初一善四金通太素質之始也天有次第最下者為欲界六天上而色界十八天無色界四天再上則四梵四天四梵之上為梵行天梵行之上方是上淸玉京玄都之境此言梵行初者蓋以梵行為初基乃嬰兒顯相始超三界之時也一者水也善者利萬物也地四生金水生於金乃子胎於母之義紫虛魏祖元君疏曰此章一氣説下晨君位黃房之中以御衆靈內則黃寧左則堅玉右則帝昌相為含攝爰生靈妙之容明輪太乙之神又相佐理焉於是拔七祖證十通五老變孩靈奇莫匹而其道在於水府凝玄金華結聚一善四金而梵行爰登也天之生人賦之以性即識精也精為水元萬善之本也一而能善性從此得道亦從此基萬善皆歸矣是為太素四梵妙行之道素華地四梵通十方也太極主四真人元君道經第二十七元始天王曰太極主四真凌羽逸上淸太極元君有曰太極元君乘凌羽之車揚威於高上之天也七轉召司命太乙揚威明七轉丹功也司命中央司命丈人君也太乙即務猶收威明者膽神龍曜之字也司録保儲命三舉登震靈兩腎之中右有司命左有司録保儲命者保舉儲二之命為大本也三舉三次舉之也震靈見前魔王來受事仙官束鬼精月中靑帝母號曰芬艷嬰月中有五夫人靑帝之夫人名隱娥珠字芬艷嬰太張上五符安來上玉名黃素中元君字曰太張上紫素元君字安來上混化六合室洞房列火兵混化指三元君而言六合室見前洞房即絳宫言以心家真火煉金鼎神丹火候抽添不可或誤故列火兵以嚴衛之言以神光照察也太極五靈沖橫文帝子賓太極行之始也五行全備五氣沖和攝五成一結為橫文橫文散彩乃性色之微神光之妙也功夫證此可作帝子之賓矣紫虛魏祖元君疏曰此章分二段解上八句言元君高居太極統御四真四真者太易太初太始太素四真也召司命而揚威明保儲命而舉震靈元君威力所敷辟魔束鬼一淸陰翳也下六句言月中有靑帝之母混合二素之君洞房列火橫文結就而帝子稱賓乃太極五靈之應也橫文文之堅定者五靈沖鬱結就橫文不為灝氣所移罡魔所翳如樹之根橫生以固其幹也是為太極五靈妙行之道黃華天五始通太淸也四斗中真七晨散華君道經第二十八元始天王曰斗中四真人散華玉淸臺七晨散華君有曰玉淸天中有散華之臺帝卿仲玄生一回衆真來帝卿乃帝一之次統攝衆真而萬氣畢從也香風扇三寶五臟映淸夷散華君有曰七晨天中有返生之香氣返沖於三寶之山山在四斗之中上有金琅之館名曰映淸夷之宫其中上皇真人皆頂負寶曜體映圓光氣合三寶靈洞五臟也蒼胡頡光華檀熾鈞吉祥檀熾鈞音和神悅氣招真召靈吉祥之音也太中六氣淸曲水襄天河太中無過不及之謂六氣者在天則有欲界六天在地則有六陰天宮也曲水者泉曲之水謂腎部也襄合也助也天河以喻髓海即黃河逆流之義六度功圓成五魔伐六陰六度萬行功德圓成五魔者靑天魔王巴元醜伯赤天魔王負天擔石白天魔王反山六目黑天魔王監醜朗馥黃天魔王橫天擔力也六陰見前中結元始王高觀六合庭元始即真一之帝混沌沖漠非有非無之象也安居太極之內故曰高觀六合功無上也紫虛魏祖元君疏曰此章分二段解散華君處玉淸之臺帝卿回衆真以朝之香風一扇五臟淸夷檀熾成音蒼頡現象仙福之淸華也曲水襄河功圓六度法王證果六合高觀仙道之周成也是為太中六合妙行之道瓊華地六始通冥陽也辰中黃景君道經第二十九元始天王曰辰中黃景氣三秀登霄庭滄臺飛羽輪迎延道已成辰中黃景元君有曰辰中真人帶延迎之符登太霄之庭飛羽輪于滄浪之臺佩玉章之文于太霞之宫辰者天之辰次也三秀者天中山名也司命奉帝書號曰玄度卿司命見前帝書心中之符籍也玄度卿者司命文人之字保生太霞宫列賓館上淸保生護命于太霞之宫即綘室也列賓指衆真也館舍也命門合精延守我身黃寧左擕元素君右攝朱鬱靈神名俱見前太和度七覺點火生真文太和之氣通于心孔發生靈覺點火者地二點而生火天七成之為南陵朱陵火府真文者五方雲篆冶之流火之庭者也夫開萬古之蒙者覺也開長夜之昏者火也以覺開覺是謂以火點火紫華領胎仙元命真中人紫華真人引領胎仙證登仙果元命者受天之明命真中有神長生大君其體圓明虛淨曠劫不壞謂之真中之人紫虛魏祖元君疏曰此章一理貫下黃景君帶延迎之符登太霄之庭司命五神咸左右焉於是太和度其七覺點火發其真文而仙胎可領元命歸真太霞之上道上淸之妙理矣是為太和七覺妙行之道金華天七始通太玄也夫七覺之象為離離則火也火虛則明點之者燭其虛以著其熖也七覺開解則七燈洞朗而吾道仙矣金闕後聖大平李真天帝上景君道經第三十元始天王曰金闕上景氣十方暉紫煙金闕上景君有曰金闕之中有上景之氣氣色鬱鬱暉照十方乃後聖之靈都太平之所會也三合太乙尊五召太元神三合玄元始三氣合德也太乙尊即尊神務猶收也太元神乃北方精魂之名字曰玉帝七轉召嶽真玉符告三官七轉丹功也嶽真五嶽之真即五臟之應也玉符天信也以之告下天地水官也拔籍三塗下受生高上辰三塗見前辰極也太帝八靈王一化回慶雲太帝精魂名陽堂玉字八靈一化言一變化間回取慶雲以開生門也桃君守六合勒精衛泥丸桃君保命門之氣歸于頂門故云守六合而帝之肇勒精同衛之也太淸八景觀十德真文宣此太淸非指太淸之天乃性躋無色而內湛淵渟得淸中之淸故曰太淸八景十德見前觀內觀也洞觀于內景之中也真文即大洞之文也氣和音和兆生天文自然曲折而成章也保子神中神元命生自然上神字是精氣神之神也下神字是煉精化氣煉氣化神之神也大洞真一豈非神中之神乎故曰生自然紫虛魏祖元君疏曰此章一氣説下章中之神計有九焉與帝合氣者二太乙太元也拔籍受生者四嶽真并三官也化慶雲而開生門者一太帝八靈也守衛神宫者二桃君及勒精也各效其能共襄其化而八景可觀十德能宣神中之神生于自然為太淸八景妙行之道緑華地八元通上淸也夫人皆有元命苟不得其元則不可以為命矣性以無為元氣以有為元無而不無性中有氣也有而不有氣中有性也有無相合元命乃成自然之道機也太虛後聖無景彭室真君道經第三十一元始天王曰太虛空無景霞中有彭室始氣之先天光未明混沌太虛玄景始分故曰空無景彭室真君有曰太霞之中有彭彭之室九雲合重扉帝君靜幽密彭室君有曰是室也結白雲以造搆合九雲而立宇紫煙重扉神華所聚太虛帝君之所處故曰靜而幽密也八真合景君上擕女太乙膽中八真名合景君膽神上趨于頂心中陰氣咸歸故曰上擕女太乙乃九陰之神非太乙務猶收也九陰混合法云第一內妃名太乙法垣字幸正扶第二內嬪名太乙三甕字羅朱英第三上元丹母名太乙虗夷字仲雙兆第四中元內妃名太乙七烈字橫單槃第五斗中太女名太乙鬱書字疇丘蘭第六斗中中女名太乙氣精字抱定陵第七斗中少女名太乙郁墨字天凡第八左夫人名太乙右啓字落茂華第九右夫人名太乙薈條字雲育玄也雌雄混玉房九遍還返七雌一雄一帝一為三一混合洞房之中九還七返言其數也分形散六合泥丸易分別分形者言神光普遍散于六合而其分別之關泥丸主之蓋神光必從泥丸透露是其往來敷斂之路也故云分別而為之防耳太真九光輪十佺丿文結真一之中更有其真故曰太真九光之輪太陽是也十佺者即十全之義天五地六乃生成之大數故真道取之丿者系也舌系于心也心神大定心氣太和則心榮于舌而生華芝華芝者文暈如芝香流五臟也保子元氣通五氣理中頡三氣既通五氣自頡頡者剛大充塞于中也混一歸帝闕永夀無終劫變化飛上淸三千行超越泥丸帝一之真歸于帝闕夀自無終劫矣變化上淸行滿超越其可必乎紫虛魏祖元君疏曰此章太虛四句言幽密之室也八真四句言混合之神也分形四句言神光之發也保子六句言道修之證也彭室重扉有其居則神自歸八真有太乙之擕雌雄有還返之樂也神歸而功自著六合分形而丿文團結也功著而果自殊五氣理中而永夀無終也是為太真九光妙行之道碧華天九元通玉虛也十佺者乃仙道之全也十仙之道既全則丿文自結五華之氣聚于心而榮于苗舌上自生華芝華芝含潄貴氣自然矣太玄都九氣丈人主仙君道經第三十二元始天王曰太玄九氣上煙回太暉間九氣丈人主仙君有曰太玄都九氣丈人乘晨徊之風分蕩滯之山煥鬱然之煙入太暉之宫神光秀空峰五道煥三天空峰者太空之峰猶言上京也五道即五老煥明三天之上五氣朝元也駕景登絶霄乘風蕩滯神景者太陽之光也駕之以登絶霄言河車上崑崙也風者回風也回風以蕩滯神所以消陰翳也日中一運珠理心入淸間綘宫丹元君名神運珠為守心之神常運轉如日之寶珠理心者七覺開明純理無私淸淨安間所謂只滅動心不滅照心也不滅照心日珠常運矣混合三五宫纍變億萬千金四水一為一五火二木三為一五中宫戊已為一五合為三五乃四象五行交媾中宫也混合三五自可厯劫而變化矣伐絶胞樹土永斷尸血根七祖散積滯反華生幽玄黃演之氣結為胞根附于脾土須伐絶之返華者善芽增長生于北方幽玄之地乃歸根氣海也萬氣生萬神齊仙成仙王齊仙者形神俱妙同于古仙也仙王者功滿道備受書為洞天之王如茅君王子登是也太玄啓十明妙行登十真太玄者道合太玄十明即十通也十真精真玄珠氣真玄力神真玄通元真玄妙性真玄一命真玄光形真玄全德真玄洞道真玄應全真太玄紫虛魏祖元君疏曰此章分二段解纍變以上言其神光煥發駕景登霄運轉心珠淸間入理混合三五之宫纍變萬年之久太玄妙道如此其光華也下言其斬除尸血返華幽玄萬氣齊仙十真同證太玄之妙果如此其卓絶也是為太玄十明妙行之道瑶華地十玄通玉淸也以上十章皆言妙行行必由一以至十者蓋周其數于五行之中而後超其理于五行之表仙經盡命之學也而又係之以太易太初太始以至太玄者道必本于先天不少涉于後天仙經實盡性之學也總是性命雙融為天人相合之妙行上淸八皇老君道經第三十三元始天王曰上淸絶霞外八皇運九天上淸八皇老君有曰上淸之天在絶霞之外有八皇老君運九天之仙而處上淸之宫幽寥玄帝子擕此景中人帝皇太乙字幽寥無為本命之根故曰玄帝子景中人下部八景之神也晨登天老室夕晏金華庭卯時分真氣傳送至肝酉時分真氣傳送至肺也羽節命太乙錦旙召萬神堅我六仙府伐滅胞胎根大腸為尚書之府小腸為元陽府膽為蘭臺府膀胱為太和府胃為太素府三焦為無極府六氣和暢使之堅固解結生七祖散禍寧九玄赤城丹臺女扶兆入金門赤城丹臺指絳宫言女者離為中女之義金門洞房內也月母靈素蘭守閉死氣關死氣自今絶生津從茲延月中白帝夫人諱靈素蘭死氣關指氣海也萬神萬氣仙超脫位真王按金暉仙公告上淸真人云氣之所在神隨生焉神在則氣成神去則氣零氣能成神神亦成氣散為雲霧合為形影出為仙化入為真一靜為兆身動為兆神也真王言所證之位也十真妙行全太玄會明陽無上大洞尊一氣同龍光兆身太玄之氣會于明陽之天證大洞帝一尊君龍光言如龍之變化也紫虛魏祖元君疏曰此章分三段解前八句言晨登天老夕宴金華羽節錦旙老君之遊衍天中也中十句言解結七祖散禍九玄月母丹臺老君之絶死生津也後六句言萬氣齊仙十真妙行帝一龍光老君之稱尊大洞也修人至此精氣全命鍊化紫金六位已尊妙行大全回光以度祖先會明陽天我獨超證大洞帝一尊君此章以後皆言學人弘慈回度之功及修證品位之級以明真一之道自度度先度人度物如此體用之弘也此章開度七祖九玄就其近者言之東華方諸宫高晨師玉保王靑童道君道經第三十四元始天王曰東華發始暉高晨映上淸洞煥圓珠靄朗朗紫暉明按東華玉保王靑童君有曰東華者仙真之州也在始暉之間高晨玉保王之所治也東華真人呼日為紫暉明或曰圓珠七晨回帝席五老飛玉軿七晨北斗也來朝天帝之几席飛玉軿者上聖出入五老啓途羣仙翼轅也太乙景中王司命攝萬靈太乙為八景之王司命在心故能總制萬靈泛然雲波間寂盼泥丸城玉保仙王曰靑童君乘雕玉之軿御圓珠之氣登雲波之山入東華之堂寂盼靜觀也寂然不動返照天谷也七轉召三官北君稽首行五嶽應命到拔死書長生北君指腎言元神自腎起偕五臟之氣上升泥丸三舉振靈符玄解大魔精三舉工訣也振靈符見前玄解者玄妙之氣自然而解之也魔精六洞之魔也七祖生福堂玄華保黃寧祖氣生于泥丸七祖自登福堂陰陽相應如影響也保黃寧者以玄華之氣保養黃寧童子土德中也紫虛魏祖元君疏曰此章分二段解寂盻泥丸城以上言所證之修七轉召三官以下言所度之遠道君東華晨映洞煥圓珠七晨五老以至司命太乙共泛雲波泥丸寂盼道之弘也三官五嶽拔死書生七祖九玄上生福堂億曾萬祖內保黃寧濟之普也于是地根永斷鬼籍齊消萬世種族皆得生天較之前章之所度博而且衆矣此經言拔度者一十六處可見修人必玄曾祖禰升度方許已度原缺天王之訓人至矣哉扶桑大帝九老仙都君道經第三十五元始天王曰太帝九老京校仙登扶桑按九老仙皇君曰九老京者山名也在扶桑之際九老仙皇處榑桑之際治九老之京太帝君治榑桑之杪會方丈之臺也七轉召天帝司命乘神綱天之帝主玉帝也原缺元始之命召之司命即中央司命丈人君也天帝倡于前司命隨于後綱維也施于天者謂之天綱三光所由之道也貫于身者謂之神綱神氣所由之道也五嶽啓靈戶傳制大魔王嶽者面部靈戶者耳目口鼻也大魔即六根也河海皆受事立示應會方不惟制魔抑且制水河海之神咸來受事應會方者河漢朝宗于海潮汐有時如人氣由湧泉厯三關達泥丸入絳宫每日四正時刻不爽是應會有方所也保符泥丸內守神曰桃康桃康腎神運神水以泝流于泥丸也回名易死籍記仙叔火王注長生之籍削死天之名叔火王道父也雄一神名掌仙籍拔絶三塗籍去禍生上英七玄登朱宫我身會明陽三塗見前津液君名生上英去禍者解纍劫之胎根命結也上友方盈子下擕理維藏左攝明車君右輔歸盛昌月中桃康君方盈子則友愛之胞中大帝精魂名理維藏則提擕之胞中黃氣君祖明車則攝于左胞中白氣君玄歸子字盛昌則䡛于右混一玉景氣化兆結以昌四神混合氣為玉景妙合而凝以成兆神反嬰元命童檀熾鈞吉祥元神既現吉祥來集同于檀熾鈞矣天一元根仙自在光明輪性生于水而命亦生于水所以天一之元為仙之根也仙道既成不為陰陽之所拘束故曰自在光明輪者北斗位鎮北方光明輪轉以定四時天之樞也而元神之威力同于斗曜照灼中天矣紫虛魏祖元君疏曰此章分三段解上十句言太帝校仙之法也天帝司命以及五嶽河海之神無不啓靈戶而應會方而皆保于泥丸之內是總領八方統攝上下乃大洞之大法會也次六句言回名死籍受記仙王去禍上生陽明身會帝一之道備仙經之能事畢矣而竿頭再進上友下擕左右相先混一玉景以至元命吉祥光明自在為太淸太極仙王真人稱大法王子此章言宏其慈願回度天人悲智廣運不止度其祖先矣小有玉真萬華先生主圖玉君道經第三十六元始天王曰玉淸萬華宫高仙藏帝經按萬華先生主圖玉君曰小有玉真天中有萬華之宫小有先生主圖玉君之所治也此宫之中藏録上帝之寶經玉淸之隱書也主圖九天表洞觀無中生高仙上聖主圖籙於九天之表以攝氣舉仙洞觀者真空也無中生者命之始也主圖君有曰玉真天中有洞觀之堂懸在太無之中七轉召萬真五嶽一來庭三官招衆魔司録較所呈萬真周身之神氣也五嶽來庭攢簇五行也三官即三元乃三田也三田通徹魔王保迎也司命司録校勘所呈之罪福也拔籍重泉曲記名書上淸七祖解牢結穢血悉沉零重泉曲至陰之府也牢結幽牢之結也沉者去而不返零者散而不聚也返胎朱火室更受洞中生返胎胎仙也朱火室在身則為絳宫在天則為朱陵火府也洞中生即大洞帝一尊神也伯史衛神軀令我保黃寧伯史泥丸天帝君上一赤子玄凝天一名伯史華也衛神軀者神光擁護之也保黃寧為精血之主也紫虛魏祖元君疏曰此章一理貫下小有先生藏帝經于萬華主圖籙于九天攝氣舉仙而洞觀于無中生無中生者元命生于太無太無即元命也若離太無而求元命則非命若離元命而求太無亦非無無在元中元包無內謂之無中之生召萬真攝萬魔拔籍書名皆太無之玄用也于是返胎火室內保黃寧普度萬靈恩沾三世極其慈濟之功號曰太玄上德真人玄洲二十九真伯上帝司禁君道經第三十七元始天王曰玄洲絶三津羽景太無庭玄洲上帝司禁君有曰玄洲有三溺之津非飛仙莫能越也又有羽景之臺在太無之庭回霄飛重漠委化混萬精司禁君有曰司禁真伯上帝玉君時乘日月之軿披虎文之裘登重漠之山回霄者從霄漢而回也委化者千和萬合與三氣流通則自委化于萬精之內即坐在立亡之義五雲鬱絶空七霞落圓明司禁君曰玄洲又有絶空之宫在五雲之中七霞即七覺之光也太極天中呼日為圓明朗朗幽寥子梵昌濟黃寧幽寥即帝皇大乙幽寥無也梵昌帝君逢凌梵也黃寧見前五老揮絳華散香擕玉靈五氣朝元絳宫先動散香者五老遍散五香以薰蒸五臟靈明之神金質濯帝川緑煙靄流瓊神拔三塗籍仙胎結兆形凡胎鍊為金質灌濯于帝一之川緑煙瑞靄洞煥空無如瓊光之欲流言其化也三塗見前上淸玉皇師玉宸大道君靈寶天尊抱送玉帝故稱師也八景玉籙云上淸高聖太上道君者蓋二晨之精氣慶雲之紫煙玉暉輝煥金映流真結化含秀苞凝玄神寄胎母氏育形為人諱日日一日日天真字開元母妊三千七百年乃誕于西那天鬱察山浮羅嶽丹玄之阿于是受書玉虛跳景上淸位為太上高聖玉晨大道君治蕊珠日闕館七映紫房玉童玉女三十萬人侍衛與心絳宫神飛證太玄尊絳宫之神即指玉皇飛證者飛仙也紫虛魏祖元君疏曰此章一氣説下司禁君乘日月之軿登重漠之山而委化萬精之內五雲鬱絶七霞圓明天景之麗也幽寥以及五老揮華散香神景之泰也金質濯于帝川緑煙靄而流瓊玉宸道君輔兆而飛升矣修人至此登上淸真王太乙真人太元景中君刋峩嵋山中洞宫玉戶太素道君經第三十八元始天王曰三真生太無玉戶映晨霞按太素君曰太無在洞景之表太素在幽玄之上三真者三境之真也生于太無之中玉戶道之戶也黍米珠中一竅也晨日也霞明輝映于東方也太素洞元靈丹林森朱柯太素天也洞元混洞太無元也南方色赤故生木皆丹林朱柯言慧支舒發也回神九重府南昌發瓊華朱陵火府九陽梵氣結成南昌煉度之司也即洞陽宫有流火池黃華水皆發自然之瓊華百關納津液停玄三秀阿津液納于百關潤之至也三秀三華也停玄于三秀之阿亦取玄華濡潤之意兆身騰玉淸七祖離幽扃長保不終劫萬世承仙家不終劫言無盡之劫也萬世承不終劫來非指子孫也位為聖統尊玉淸大洞神聖統尊言為聖之所統而無上者也玉淸為聖境聖即元始天王大洞為元始之道故神為大洞之神耳紫虛魏祖元君疏曰此章一氣説下以明道之元也洞元心之府也以太無之靈覺之太素之光養之丹林朱柯森森鬱秀于是開府九重瓊華英發瓊華為玉淸上道修人至此登真長保不終之劫永為萬世之家升入玉淸聖王天中位統聖君上極天仙之貴大洞之尊然其道不出乎洞元太無太素之中仙經之所重可知矣西元龜山九靈真仙母靑金丹皇君道經第三十九元始天王曰西元九靈氣金丹流雲宫上極璇曜杪西元靑金丹黃君有曰崑崙山有九靈之館又有金丹流雲之宫上接璿璣之輪乃王母之所治也暉景大霞中暉景天上之太陽即飛精也暉景四句蜀本無之今談經同于茅山玉經足知蜀本傳誤動回九天輪靜沉八流剛動者言九靈之氣施行於上可以回九天之輪靜者言九靈之氣寧靜于上可以沉八流之剛剛義從罡即罡灝之氣以其屏翰萬天能摧萬物故曰剛九靈即北斗九皇也九星作中天之樞故其動靜之功用如此宫有仙胎母擕矜太帝房宫者流雲之宫也金母生于先天故曰仙胎母矜者太微小童之名也又云矜天衣也提天衣而登太帝房也即太帝精魂陽堂育也玄一靈時生三老素罕張中央玄一老子靈時道三素老君名罕張俱見前左把五符籍右擕萬神宗神宗司命丈人之名又心為萬神之宗也同登龍琳闕稽首玉淸房拔棄死滅根養形三五中七祖解尸結受福明朱方上證聖中尊符化玄氣王提擕萬神同登龍鳳琳琅之闕夫頂中宫闕有三層下五宫者明堂洞房泥丸流珠玉帝是也中四宫者天庭極真玄丹太皇是也共為九宫而太極一宫在九宫之上以象玉淸之境也養形三五指氣海也氣海為三氣五氣之所聚也受福明朱指絳宫也明為心光朱為心色也至此道備位登聖尊形化為雲符符散為玄氣觀之則為玉符聽之則為玉音不可思議大洞仙經至此大通紫虛魏祖元君疏曰此章一氣説下言其化也九靈之氣在流雲之宫動則回輪靜則沉剛造化由之升降也宫藴仙胎神登琳闕上證聖中之尊符為玄氣之王大洞仙經至此大通符者文也其文有二性文則湛而空高而朗冷然而善也氣文則妙而婉秀而淸溫然而美也來從太和去從太無廣長一丈曲折自然玄中之玄乃無色之真宗妙明之靈印矣結經玉宸道君言我師元始天尊授我此大洞仙經其旨玄奧修真妙門大洞修真之道共有十門總言其數也十門見前初定通息太和一千玉宸道君從定觀門入所以但言已之親詣不及他門也初定習定也言修真之道首在于定而定之之功要在通息通息貴于太和太和者調氣以調心心和則氣和矣未有心不和而氣能和者心和之極泰宇自定若火在琉璃盞中不搖不動徹夜常明一毫火氣不燥一毫水氣不淫此太和之景務在于息內默會之蓋真人之息貴于平平者出入相等呼吸相循恬然夷然不來而來不往而往如龍得雲魚得水深幾玄趣矣愈平愈和愈和愈定此入手之功也中觀變真離相消塵上言養氣之功此言觀性之要觀即照也性非照不覺變真者人之識性皆幻惟性乃真真淨元明之體厯劫不壞于人為最真今用密照之修則去幻而變為真矣其觀在于離相而消塵相即六根塵即六塵根塵皆滅真常獨露是謂妙觀元合五千坐在立亡此性命雙融與道而合真也元即道體也息和神定命中性也性覺氣玄性中命也太和五千而有無無礙矣坐在有之喻也立亡無之喻也坐在立亡有無莫測也大定全真妙行通靈此言其效也前言初定始基之也此言大定則身心冥寂定而能堅矣妙行者三千行滿八百功成也初曰通氣此指初定太和二句次曰通神此指中觀離相二句終曰通靈此指元合坐在二句十通成真此指大定妙行而言道備登晨超脫飛升過度三界往來三淸證品大洞天一帝尊登晨登于晨極也天一者天一之人猶老子言天上天下惟道獨尊之義六句極言證果之隆六度十通萬行圓成六度六塵度脫也二句極言功行之大干和萬合自然成真此總言大洞功圓在千萬神之和合可見全部仙經總不出一神神乃天人之會性命之全也紫虛魏祖元君疏曰仙道有十門而其門之正而大徑而捷者莫過定觀一門而定觀之所由入又莫善于單入雙修之旨單入者從息入定也人以息為命于母胎之中即通母之息為息由是生成以迄考終皆依于息者也但其息或濁或短不過以喉而已是之謂隨命之息非立命之息也若真人之息貴和和者不無不有之謂息偏于有則浮偏于無則沉俱不得其和和則有無不著謂之玄息玄息既定心亦從茲而定如果千息之中一息不漏一念不起謂之太和通氣為第一進入門之訣乃初去塵濁歸于和定之修也從此即當修觀此觀非觀想之觀觀想之觀用我之識以存想之非上道也此則掃除七識觀其入識之根一點精明落在何處身內不是身外不是內外之間亦不是斷除三際洞察虛靈一心不捨久久慧發自知真妙是謂觀真觀真道成水天乃開此第二進入門之訣為去幻尋真消塵離相之功也既見性中之地方知性外之天乃以玄息薰修真體久則色化紫金神躋堅定乃元合之功為第三進入門之訣所謂海日東生元命太初也是謂雙修之道然三進之功尤在水天一曲蓋人身中各具一天不見其天終不成道若得水天頓闢性色成淵耳目口鼻之如漚天地山川之若腐真神獨露妙頴成鋒而大道幾矣此之妙訣始則以命尋性終則以命養性性為主而命為臣者也主臣交合非明良之會太和之化乎學者宜勉之矣太上洞淵三昧帝心光明正印太極紫微伏魔制鬼拯救惡道集福吉祥神呪太極紫微妙諦經華敏忍宗太英含元文象郭舒孤界吻雕盤盧福昭明輪混洞太無玉皇玄中吉祥音檀熾鈞蒼夔和庠塗波陜符陜南臯玄母坐臺赤混太無玉虛元生吉祥音檀熾鈞翊琚儲靈內章元帝藍欹無紫衜衠瑚蒙甘冥寂玄通玉虛始神吉祥音檀熾鈞太淸紫華飛神度命岑保觚華吉祥音檀熾鈞太淸丹華飛光保生朔懋密吉祥音檀熾鈞太淸靑華飛仙鍊神豈瓦甄銘奮勵宛吉祥音檀熾鈞上淸素華飛靈鍊形浸斠唐彭燕吉祥音檀熾鈞上淸黃華飛化鍊氣窪巢婁鎬衡吉祥音檀熾鈞上淸緑華飛明護魂覺蔭珂琰觀吉祥音檀熾鈞玉淸淫王華飛玄長生藍蘇丹株包企模吉祥音檀熾鈞玉淸碧華飛黃飛仙晶羅頡力吉祥音檀熾鈞玉淸玉華飛玄洞玄都明晨旭晨吉祥音檀熾鈞玉虛金華飛玄妙靈旭薈晨轆吉祥音檀熾鈞洞淵黃華三昧帝心大洞光明正印玄章太極真常紫微真母降伏六天制禦萬鬼拯救惡趣賓治儀盧消滅萬災集福結集生氣貫入玄津演吉祥音檀熾鈞注歸丹母發生內寶玉芝琅英黃芽金液琅玕玄珠九轉八璚證聖真仙十道妙行圓滿濟度大洞帝一尊君吉祥音檀熾鈞天尊彼時玉音光中增飾妙華洞觀始通吉祥音檀熾鈞洞微梵通吉祥音檀熾鈞洞空氣通吉祥音檀熾鈞洞虛華通吉祥音檀熾鈞洞靈力通吉祥音檀熾鈞洞真道通吉祥音檀熾鈞洞玄靈光通吉祥音檀熾鈞洞源神通洞明帝心玄通洞淸冥惠元通吉祥音檀熾鈞終全真一安處無為妙行一乘中觀思神念真惠命作用通氣制禦萬靈吉祥音檀熾鈞通神坐致自然通靈坐在立亡吉祥音檀熾鈞道備登晨飛升太空位登仙翁侍列玉淸無氣上真吉祥音檀熾鈞太真玄符普度天人吉祥音檀熾鈞是時元始天尊與威德自在天尊同聲重説太極紫微伏魔制鬼拯救惡道消災集福吉祥神呪已六天震動魔山崩摧𡨚裔絶原地根斷蒂鬼趣消滅俱化善神是時會中無量飛仙淸和玉女水史真妃芳華采玉女百千億萬衆雨八色天華繽紛飄下香風薰馥和氣氤氲元始天王告定一真人蔚羅真人曰此神呪玉章乃三昧帝心光明正印太極妙本紫微真人能破𡨚魔心能救惡趣苦能消萬災劫能集萬吉祥功德無邊不可思議今日為汝等重宣玉文增飾呪心圓滿妙行使汝等持此呪印利益人天度諸有情齊登聖果今宣玉敕囑二真人汝稟命奉行普濟普度敕威德自在天尊定一二真人遍滿十方界持我光明輪三昧太定印帝心行大心制伏六洞魔破滅萬鬼羣解釋十二𡨚結網悉消平鬼趣絶惡根凶魔化善神我道一氣沖淸和鼓化風自彼鬼類幽直超三善中帝心成大心正氣永和融學仙修大乘妙行著玄功修猰與貙悟真登仙公使彼洞淵心玄玄控三龍化合衆生心光明證十通安集太真房逍遙景華峰怡然金闕庭玉光他我同氣與元始通吉祥成大功于是太玄道父威德自在天尊定一真人蔚羅明真人飛仙玉女淸和玉女水史真妃芳華采玉女諸天仙衆異口同光普作一音太和自然是時太玄道父威德自在天尊定一真人蔚羅明真人諸天真人神仙天帝神王仙官仙王飛仙玉女水史真妃芳華采玉女等説偈贊歎已稽首天尊奉辭而退太上玉淸無極總真文昌大洞仙經注疏卷下誦經畢言奉玉淸誥詣三寶前列班回向舉讚東華發始暉自在光明輪五道煥三天運我神仙軿七晨回帝席八真合景君朽骨蒙更蛻拔死書長生稽首玉淸房無上大洞尊臣聞三一合神三素飛雲朝帝一百真大混百關耀景證玄真吟咏周圓恭伸回向具職臣某誠惶誠恐稽首頓首再拜上啓三淸三境天尊金闕玉皇上帝二極九霄諸天高聖祖師太玄道父牛孳先生定一真人蔚羅明真人祖師父昌元皇道君文昌皇人玄聖道君祖師總真紫虛元君三天張葛許真君靈寶五師三茅司命真君傳經傳法傳籙厯代祖玄真經籍度真師司命司録執籍執經救劫衍慶侍真列聖應感仙官三界萬靈十方真宰經筵拱衛壇靖曹治一切靈聰咸望洪慈洞垂照鑒伏念臣肅志飭躬運神會道披瓊章而宣妙梵音轉吉祥凝紫氣以遍光華神超大洞胞根永斷命蒂長生十華十德之完全千行千功之滿足果臻福夀位列飛仙向請先天靈氣兆身萬神各安方位務令厯劫宗親今生七祖同駕雲輿所願如心普天齊慶不勝懇禱載謹言志心稱念玉淸元始天尊威德自在天尊更生永命天尊不可思議功德釋音丿撇吻文衠真角間間豈瓦愷轆標大洞玉經跋夫世之言道者多矣總不離于性與命而巳但言性不言命者每墮于無言命不言性者偏著之有均非道之大全也道則本于無極煦含停育于太空之中其靈明之理謂之性絪緼之氣謂之命乃自然道機理氣相符不可分而言也是性本于無命屬于有無而不無性不可離命也有而不有命不可離性也天王開示大洞拔度種民經之所重聿在性命雙修其所言性乃命中之性所言命乃性中之命爾蓋凡物各具一太極人身之三田八景七政九宫亦各具一太極太極具而神明生焉此經三十九章所以有道君元君七十餘位之尊神也有此神而一毫端能現寶王剎非性來歸命為命中之性乎見色聞聲手持足履命之常也而乃方瞳洞照梵耳虛明以至大意朗元十通並證非命復歸性為性中之命乎修之之道端在千和而萬合矣蓋性不與命相融則不可為和命不與性相融亦不可為合千和萬合性命混同使智相歸一而後自然成真也夫智冥于相而智始圓相冥于智而相乃妙圓妙之機非天下之至神其孰能與于此哉神者化也化則入于玄太玄重玄玄一之道皆元神微妙之光深造而曲暢者也故神之散也為大洞寶文神之聚也為帝一真道元始天王九統會帝九光集神豐功荗德洞煥玉淸究不出乎蒼胡頡寶中之三寸神孩也神其可忽乎哉顧欲修其神必先會夫元元者神之本經所稱高上洞元乃中黃太乙天寶玉皇之祖也中黃為天心真土靈度人經云元始祖土名為太空空為太乙胞養三界化生諸天開明三景是為天根學者悟入玄中得此太乙元精則空生慧慧生定定則命堅慧則性命和合共成一圓明淸淨寶覺而大洞之道幾矣珍皈道有年持誦仙經滿四萬餘遍于大洞之理竊有所契茲者彚集注疏繡梓告成敢一言以闡其要使學者知鐵頴之神鋒莊嚴之妙相俱不外此三千五百餘字中也幸毋玩視焉康熙已丑歲臘月望日隴干弟子慕珍稽首敬跋
